<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>产物库 · DeepSeek Harness</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#2a3242;
    --fg:#e6edf3; --dim:#8b98a9; --acc:#4da3ff; --acc2:#79c0ff;
    --warm:#ffb86c; --star:#ffd166; --ok:#3fb950; --danger:#f85149;
    --radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;padding:20px;max-width:1200px;margin:0 auto}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  header h1{font-size:20px;font-weight:700;letter-spacing:.5px}
  header h1 .dot{color:var(--acc2)}
  .stats{display:flex;gap:10px;flex-wrap:wrap}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 12px;font-size:12px;color:var(--dim)}
  .stat b{color:var(--fg)}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  input,select,button{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:7px 12px;font-size:13px;outline:none}
  input:focus,select:focus{border-color:var(--acc)}
  button{cursor:pointer;transition:.15s}
  button:hover{border-color:var(--acc)}
  button.primary{background:var(--acc);border-color:var(--acc);color:#04121f;font-weight:600}
  button.primary:hover{background:var(--acc2)}
  button.danger{color:var(--danger);border-color:var(--danger)}
  button.ghost{background:transparent}
  .grow{flex:1}
  .view-switch{display:flex;gap:4px}
  .view-switch button{padding:6px 14px}
  .view-switch button.active{background:var(--acc);border-color:var(--acc);color:#04121f;font-weight:600}
  .sep{width:1px;height:24px;background:var(--line)}
  /* 卡片视图 */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:.15s}
  .card:hover{border-color:var(--acc);transform:translateY(-2px)}
  .thumb{height:130px;background:var(--panel2);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .thumb .ico{font-size:34px;opacity:.5}
  .card-body{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
  .card-title{font-weight:600;word-break:break-all}
  .card-summary{color:var(--dim);font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card-meta{font-size:11px;color:var(--dim);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .badge{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:1px 8px;font-size:11px}
  .badge.warm{border-color:var(--warm);color:var(--warm)}
  .badge.archived{color:var(--dim)}
  .card-actions{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--line)}
  .card-actions button{font-size:12px;padding:4px 10px}
  /* 列表视图 */
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
  th{color:var(--dim);font-weight:600;font-size:12px;background:var(--panel2)}
  tr:hover td{background:var(--panel2)}
  td .mini-thumb{width:52px;height:36px;object-fit:cover;border-radius:6px;display:block;background:var(--panel2)}
  /* 项目视图 */
  .group{margin-bottom:18px}
  .group h3{font-size:15px;margin-bottom:10px;color:var(--acc2);display:flex;align-items:center;gap:8px}
  .group h3 .count{color:var(--dim);font-size:12px}
  .stars{color:var(--star);cursor:pointer;letter-spacing:2px;user-select:none}
  /* 预览 */
  #lightbox{position:fixed;inset:0;background:rgba(5,8,14,.92);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:99;padding:30px}
  #lightbox img{max-width:90vw;max-height:80vh;border-radius:8px}
  #lightbox pre{max-width:90vw;max-height:70vh;overflow:auto;background:var(--panel);padding:16px;border-radius:8px;white-space:pre-wrap;word-break:break-all}
  #lightbox video{max-width:90vw;max-height:70vh}
  #lightbox .close{position:absolute;top:18px;right:24px;font-size:26px;cursor:pointer;color:var(--dim)}
  #lightbox .meta{color:var(--dim);font-size:13px;max-width:80vw;text-align:center}
  .lb-stage{position:relative;max-width:90vw;max-height:76vh;overflow:hidden;background:rgba(0,0,0,.4);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:grab}
  .lb-stage.dragging{cursor:grabbing}
  .lb-stage img{max-width:88vw;max-height:72vh;transition:transform .08s ease-out;user-select:none;-webkit-user-drag:none}
  .lb-stage.dragging img{transition:none}
  .lb-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
  .lb-controls button{font-size:12px;padding:3px 12px}
  .lb-controls .pct{font-size:12px;color:var(--dim);min-width:52px;text-align:center}
  .lb-rate{display:flex;gap:10px;align-items:center;color:var(--dim);font-size:13px}
  .lb-rate input[type=range]{width:200px;accent-color:var(--acc)}
  .lb-rate b{color:var(--fg);min-width:44px;text-align:center}
  /* 弹窗 */
  .modal{position:fixed;inset:0;background:rgba(5,8,14,.75);display:none;align-items:center;justify-content:center;z-index:98;padding:20px}
  .modal.open{display:flex}
  .modal-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:100%;max-width:560px;max-height:86vh;overflow:auto;padding:22px}
  .modal-box h2{font-size:16px;margin-bottom:16px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;color:var(--dim);margin-bottom:4px}
  .field input,.field textarea,.field select{width:100%}
  .field textarea{resize:vertical;min-height:60px}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
  .empty{color:var(--dim);text-align:center;padding:50px 0}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 18px;font-size:13px;display:none;z-index:100}
  .toast.show{display:block}
  .notes-line{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
  .trash-bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  /* v0.3：语义搜索 / 整理建议 / 相关建议 */
  .sem-hit{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:.15s}
  .sem-hit:hover{border-color:var(--acc)}
  .sem-hit .t{font-weight:600}
  .sem-hit .m{color:var(--dim);font-size:12px;margin-top:2px}
  .sem-hit .k{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:0 8px;font-size:11px;color:var(--acc2);margin-right:4px}
  .sugg-item{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:8px}
  .sugg-item .grow{flex:1}
  .sugg-item .why{color:var(--dim);font-size:12px}
  .cleanup-group{margin-bottom:14px}
  .cleanup-group h4{font-size:13px;color:var(--acc2);margin-bottom:8px}
  .cleanup-item{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:6px;font-size:13px}
  .cleanup-item .grow{flex:1}
  .hint{color:var(--dim);font-size:12px}
/* ── 文件 / 改动视图（2026-10-14 新增 · 档 1d）──────────────────────────
   从主面板的 DirBrowser / FilesView / ChangesView 搬来。
   颜色只用既有 token（--fg/--dim/--line/--panel…），不新造变量。 */
.files-bar{display:flex;gap:8px;align-items:center;margin:10px 0 4px}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0;font-size:13px}
.crumb{color:var(--acc);cursor:pointer}
.crumb:hover{text-decoration:underline}
.crumb-sep{color:var(--dim)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;word-break:break-all}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;background:var(--panel2);padding:1px 5px;border-radius:4px}
/* ── 标签芯片（2026-10-14 从主面板 DetailDrawer 搬来）────────────────────
   受管标签带颜色/字重；自由词素文本。**受管 ≠ 有样式**（受管没配样式的也是芯片）。
   颜色按规则层的 8 个槽名映射到既有 token —— 不写 hex（写死就不跟随主题）。 */
.tagchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;line-height:16px;margin:6px 0}
.tagchip{border:1px solid var(--line);border-radius:999px;padding:1px 9px;background:var(--panel2);color:var(--fg)}
.tagchip.bold{font-weight:600}
.tagfree{color:var(--dim);padding:1px 4px}
.tagchip.c-neutral{border-color:var(--line);color:var(--dim)}
.tagchip.c-blue{border-color:#3b82f6;color:#60a5fa}
.tagchip.c-sky{border-color:#0ea5e9;color:#38bdf8}
.tagchip.c-green{border-color:#22c55e;color:#4ade80}
.tagchip.c-amber{border-color:#f59e0b;color:#fbbf24}
.tagchip.c-orange{border-color:#f97316;color:#fb923c}
.tagchip.c-red{border-color:#ef4444;color:#f87171}
.tagchip.c-violet{border-color:#8b5cf6;color:#a78bfa}
</style>
</head>
<body>
<header>
  <h1>🐋 产物库 <span class="dot">· DeepSeek Harness</span></h1>
  <div class="stats" id="stats"></div>
  <div class="grow"></div>
  <button class="primary" onclick="openRegister()">＋ 登记产物</button>
  <button onclick="openImport()">📥 导入文件夹</button>
  <button onclick="location.href=API+'/export'">📦 导出备份</button>
  <button onclick="refineProject()" title="精化当前所选项目下所有待精化条目">⚡ 精化项目</button>
  <button onclick="refineFolder()" title="精化所有文件夹导入的待精化条目">⚡ 精化文件夹</button>
  <button class="primary" onclick="openRefineModal()" title="新开/复用精化会话，可临时指定模型，立即精化全部待精化条目">🚀 立即精炼</button>
  <button onclick="openSemantic()" title="用一句话描述找产出/资料">🔍 语义搜索</button>
  <button onclick="openCleanupSuggest()" title="看看库里有啥值得整理的">🧹 整理建议</button>
  <button onclick="openSettings()">⚙️ 设置</button>
  <button class="ghost" id="trashBtn" onclick="toggleTrash()">🗑️ 回收站</button>
</header>

<div id="selBar" class="trash-bar" style="display:none">
  <span class="badge" style="color:var(--acc2);border-color:var(--acc2)">已选 <b id="selCount">0</b> 项</span>
  <button class="primary" onclick="refineSelected()">⚡ 立即精化所选</button>
  <button onclick="batchTrash()">🗑️ 批量回收</button>
  <button onclick="batchProject()">📁 批量改项目</button>
  <button onclick="batchTags()">🏷️ 批量加标签</button>
  <button onclick="selectAllPending()">全选待精化</button>
  <button onclick="clearSel()">清除选择</button>
</div>

<div class="toolbar">
  <input class="grow" id="q" placeholder="搜索标题 / 摘要 / 正文 / 文件名…" oninput="debouncedReload()">
  <select id="fKind" onchange="reload()"><option value="">全部</option><option value="deliverable">产出</option><option value="reference">资料</option></select>
  <select id="fRefine" onchange="reload()"><option value="">全部状态</option><option value="1">待精化</option><option value="0">已精化</option></select>
  <select id="fProject" onchange="reload()"><option value="">全部项目</option></select>
  <select id="fType" onchange="reload()"><option value="">全部类型</option></select>
  <select id="fTag" onchange="reload()"><option value="">全部标签</option></select>
  <select id="fSort" onchange="reload()">
    <option value="created_desc">最新登记</option>
    <option value="created_asc">最早登记</option>
    <option value="updated_desc">最近更新</option>
    <option value="stars_desc">星级最高</option>
    <option value="size_desc">文件最大</option>
    <option value="name_asc">名称 A→Z</option>
  </select>
  <div class="sep"></div>
  <div class="view-switch">
    <button data-v="list" onclick="setView('list')">列表</button>
    <button data-v="card" class="active" onclick="setView('card')">卡片</button>
    <button data-v="project" onclick="setView('project')">项目</button>
    <button data-v="files" onclick="setView('files')">文件</button>
    <button data-v="changes" onclick="setView('changes')">改动</button>
  </div>
</div>

<div id="missBar" class="trash-bar" style="display:none">
  <span class="badge danger">⚠️ 有 <b>0</b> 条登记的文件已不在原位置（整理只能刷新状态、找不回文件；可在「🧹 整理建议」里归档或删除记录）</span>
</div>

<div id="trashBar" class="trash-bar" style="display:none">
  <span class="badge danger">回收站：恢复或永久删除</span>
  <button onclick="emptyTrash()" class="danger">清空回收站</button>
</div>

<main id="content"></main>

<div id="lightbox" onclick="if(event.target===this)closeLb()">
  <div class="close" onclick="closeLb()">✕</div>
  <div id="lbBody"></div>
  <div class="meta" id="lbMeta"></div>
</div>

<div class="modal" id="regModal">
  <div class="modal-box">
    <h2 id="regTitle">登记产物</h2>
    <div class="field"><label>类型</label>
      <select id="r_kind" onchange="regKindHint()">
        <option value="deliverable">📦 产出（自己做的作品/文件）</option>
        <option value="reference">📚 资料（参考/素材/收藏）</option>
      </select>
    </div>
    <div class="field"><label>文件路径（绝对路径，必填）</label><input id="r_path" placeholder="C:\Users\..."></div>
    <div class="field"><label>标题</label><input id="r_title" placeholder="缺省用文件名"></div>
    <div class="field"><label>摘要（做了什么、解决什么问题）</label><textarea id="r_summary"></textarea></div>
    <div class="field"><label>所属项目</label><input id="r_project" placeholder="例如：项目A / 项目B（留空则未分类）"></div>
    <div class="field"><label>交付物类别</label><input id="r_deliverable" placeholder="报告 / 原型 / 安装包 / 设计稿…"></div>
    <div class="field"><label>类型</label>
      <select id="r_type">
        <option value="document">document</option><option value="image">image</option>
        <option value="audio">audio</option><option value="video">video</option>
        <option value="code">code</option><option value="archive">archive</option>
        <option value="other">other</option>
      </select>
    </div>
    <div class="field"><label>标签（逗号分隔）</label><input id="r_tags" placeholder="可爱, 设计稿"></div>
    <div class="field"><label>备注</label><textarea id="r_notes"></textarea></div>
    <div class="modal-actions">
      <button onclick="closeModal('regModal')">取消</button>
      <button class="primary" onclick="submitRegister()">登记</button>
    </div>
  </div>
</div>

<div class="modal" id="importModal">
  <div class="modal-box">
    <h2>📥 导入文件夹（资料）</h2>
    <div class="field"><label>文件夹路径（绝对路径）</label><input id="i_dir" placeholder="C:\path\to\folder"></div>
    <div class="field"><label>项目名（留空则用文件夹名）</label><input id="i_project" placeholder="可选"></div>
    <div class="field" style="color:var(--dim);font-size:12px">扫描该文件夹下所有文件，作为「资料」导入；目录名/父目录名自动当项目与标签；文本文件会本地抽取正文供全文检索。<b>全程本地完成，绝不上传任何内容。</b></div>
    <div class="modal-actions">
      <button onclick="closeModal('importModal')">取消</button>
      <button class="primary" onclick="submitImport()">开始导入</button>
    </div>
  </div>
</div>

<div class="modal" id="settingsModal">
  <div class="modal-box">
    <h2>⚙️ 设置</h2>
    <div class="field"><label><input type="checkbox" id="s_auto" style="width:auto;margin-right:8px">自动采集（会话产出文件自动进库）</label></div>
    <div class="field"><label>每轮自动采集上限（条）</label><input id="s_maxturn" type="number" min="1" max="500"></div>
    <div class="field"><label><input type="checkbox" id="s_clean" style="width:auto;margin-right:8px">定时整理（去重/刷新文件状态）</label></div>
    <div class="field"><label>整理频率（天）</label><input id="s_days" type="number" min="1" max="365"></div>
    <div class="field"><label><input type="checkbox" id="s_backup" style="width:auto;margin-right:8px">整理前自动备份</label></div>
    <div class="field"><label>备份保留份数</label><input id="s_keep" type="number" min="1" max="100"></div>
    <div class="field" style="color:var(--dim);font-size:12px">下次整理时间：<span id="s_next">—</span></div>
    <div class="field"><label>精炼每批条数</label><input id="s_batch" type="number" min="1" max="200"></div>
    <div class="field"><label>单文件导入上限（MB）</label><input id="s_maxmb" type="number" min="1" max="2048"></div>
    <div class="field"><label>语义搜索默认条数</label><input id="s_slimit" type="number" min="1" max="200"></div>
    <div class="modal-actions">
      <button onclick="cleanupNow()">🧹 立即整理一次</button>
      <button onclick="closeModal('settingsModal')">取消</button>
      <button class="primary" onclick="submitSettings()">保存</button>
    </div>
  </div>
</div>

<div class="modal" id="refineModal">
  <div class="modal-box">
    <h2>🚀 立即精炼</h2>
    <div class="field"><label>本次精炼使用的模型</label>
      <select id="r_model"><option value="">（用部署默认模型）</option></select></div>
    <div class="field" style="color:var(--dim);font-size:12px">临时指定，只作用于本次精炼会话；<b>不改动部署默认模型</b>，也不影响其它会话。</div>
    <div class="modal-actions">
      <button onclick="closeModal('refineModal')">取消</button>
      <button class="primary" onclick="submitRefineModal()">开始精炼</button>
    </div>
  </div>
</div>

<div class="modal" id="semanticModal">
  <div class="modal-box">
    <h2>🔍 语义搜索</h2>
    <div class="field"><label>用一句话描述你想找的东西（不用记文件名）</label>
      <input id="s_q" placeholder="例如：上次那个视频素材 / 给项目做的那张封面图 / 写插件时的调研文档" onkeydown="if(event.key==='Enter')runSemantic()"></div>
    <div class="modal-actions">
      <button onclick="closeModal('semanticModal')">取消</button>
      <button class="primary" onclick="runSemantic()">搜索</button>
    </div>
    <div id="semResults" style="margin-top:14px"></div>
  </div>
</div>

<div class="modal" id="cleanupModal">
  <div class="modal-box">
    <h2>🧹 整理建议</h2>
    <div id="cleanupBody" class="hint" style="padding:10px 0">扫描中…</div>
    <div class="modal-actions">
      <button onclick="closeModal('cleanupModal')">关闭</button>
    </div>
  </div>
</div>

<div class="modal" id="editModal">
  <div class="modal-box">
    <h2>编辑产物</h2>
    <div class="field"><label>标题</label><input id="e_title"></div>
    <div class="field"><label>摘要</label><textarea id="e_summary"></textarea></div>
    <div class="field"><label>所属项目</label><input id="e_project"></div>
    <div class="field"><label>交付物类别</label><input id="e_deliverable"></div>
    <div class="field"><label>类型</label><select id="e_type">
      <option>document</option><option>image</option><option>audio</option><option>video</option><option>code</option><option>archive</option><option>other</option>
    </select></div>
    <div class="field"><label>标签（逗号分隔）</label><input id="e_tags"></div>
    <div class="field"><label>引用资料 ID（逗号分隔，产出用了哪些资料）</label><input id="e_refs" placeholder="art_xxx, art_yyy" oninput="updateRefNames()"><div id="e_refs_names" style="font-size:12px;color:var(--acc2);margin-top:4px"></div></div>
    <div class="field"><label>💡 相关建议（自动扫描库里可能相关的产出/资料，点击填入引用）</label>
      <div id="e_related" style="font-size:12px"><button type="button" onclick="loadRelated()">扫描相关条目</button></div></div>
    <div class="field"><label>星级（点击设置 0-5）</label><div id="e_stars"></div></div>
    <div class="field"><label>备注</label><textarea id="e_notes"></textarea></div>
    <div class="modal-actions">
      <button onclick="closeModal('editModal')">取消</button>
      <button class="primary" onclick="submitEdit()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '/ext/artifacts'
let state = { view: 'card', trash: false, items: [], categories: { projects: [], types: [], tags: [] }, stats: null, selected: new Set(), refIndex: {}, page: 1, pageSize: 60,
  // ⭐ 2026-10-14 新增（档 1d）：文件浏览 / 文件搜索 / 会话改动
  //    这三块原来是**主面板**的能力，面板删了 ⇒ 搬到网页版（依琪：「允许你做成网页版本展示全部内容」）
  files: { dir: '', entries: [], total: 0, truncated: false, error: '', loading: false },
  fileQuery: '', fileResults: null, fileSearching: false,
  changes: { status: 'idle', items: [], derived: false, sessionId: '', error: '' } }

const $ = (id) => document.getElementById(id)
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
const fmtSize = (b) => b > 1048576 ? (b/1048576).toFixed(1)+' MB' : b > 1024 ? (b/1024).toFixed(0)+' KB' : b+' B'
const fmtDate = (ts) => ts ? new Date(ts*1000).toLocaleString('zh-CN', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—'

async function api(url, opts = {}) {
  const r = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts })
  if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error || r.status) }
  return r.json()
}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200) }

async function reload() {
  try {
    const p = new URLSearchParams({ sort: $('fSort').value })
    if (state.trash) p.set('status', 'trashed')
    const q = $('q').value.trim(); if (q) p.set('q', q)
    const kd = $('fKind').value; if (kd) p.set('kind', kd)
    const rf = $('fRefine').value; if (rf) p.set('refine', rf)
    const pr = $('fProject').value; if (pr) p.set('project', pr)
    const ty = $('fType').value; if (ty) p.set('artifact_type', ty)
    const tg = $('fTag').value; if (tg) p.set('tag', tg)
    state.items = await api(API + '?' + p)
    state.page = 1
    render()
  } catch (e) {
    $('content').innerHTML = `<div class="empty">❌ 加载失败：${esc(e.message)}（检查插件是否已安装并重启 dsh web）</div>`
  }
}
const debouncedReload = (() => { let t; return () => { clearTimeout(t); t = setTimeout(reload, 300) } })()

// id → 标题 索引（用于显示"引用了哪些资料"）
async function refreshRefIndex() {
  try { const all = await api(API + '?limit=5000'); state.refIndex = {}; for (const r of all) state.refIndex[r.id] = r.title } catch { /* 忽略 */ }
}
function refNames(ids) { return (ids || []).map((id) => state.refIndex[id] || id).filter(Boolean) }

async function loadMeta() {
  const [cats, stats] = await Promise.all([api(API + '/categories'), api(API + '/stats')])
  state.categories = cats; state.stats = stats
  $('fProject').innerHTML = '<option value="">全部项目</option>' + cats.projects.map((x) => `<option>${esc(x)}</option>`).join('')
  $('fType').innerHTML = '<option value="">全部类型</option>' + cats.types.map((x) => `<option>${esc(x)}</option>`).join('')
  $('fTag').innerHTML = '<option value="">全部标签</option>' + cats.tags.map((x) => `<option>${esc(x)}</option>`).join('')
  $('stats').innerHTML =
    `<div class="stat">共 <b>${stats.total}</b> 件</div>` +
    `<div class="stat">待精化 <b>${stats.pendingRefine || 0}</b></div>` +
    `<div class="stat">归档 <b>${stats.archived}</b></div>` +
    `<div class="stat">回收站 <b>${stats.trashed}</b></div>`
  // 缺失文件提醒
  const miss = stats.missingFiles || 0
  const warn = $('missBar')
  if (warn) { warn.style.display = miss ? 'flex' : 'none'; if (warn.querySelector('b')) warn.querySelector('b').textContent = miss }
}
// 撤销式 toast：消息 + [撤销] 按钮，几秒后消失
let undoHandle = null
function undoToast(msg, undoFn) {
  const t = $('toast')
  t.innerHTML = `${esc(msg)} <button class="primary" style="margin-left:10px;padding:3px 10px" onclick="(async()=>{try{await undoFn();toast('✅ 已撤销')}catch(e){toast('❌ 撤销失败：'+e.message)}finally{clearTimeout(undoHandle)}})()">撤销</button>`
  t.classList.add('show')
  clearTimeout(undoHandle)
  undoHandle = setTimeout(() => t.classList.remove('show'), 6000)
}
function setView(v) { state.view = v; document.querySelectorAll('.view-switch button').forEach((b) => b.classList.toggle('active', b.dataset.v === v)); render() }
function toggleTrash() { state.trash = !state.trash; $('trashBar').style.display = state.trash ? 'flex' : 'none'; $('trashBtn').classList.toggle('primary', state.trash); reload() }
async function emptyTrash() { if (!confirm('永久删除回收站内全部产物？')) return; const ids = state.items.map((r) => r.id); for (const id of ids) await api(API + '/' + id, { method: 'DELETE' }); toast('回收站已清空'); reload() }

function starsHtml(r) {
  let h = '<span class="stars" title="点击打分">'
  for (let i = 1; i <= 5; i++) h += `<span onclick="event.stopPropagation();setStars('${r.id}',${i})">${i <= r.stars ? '★' : '☆'}</span>`
  return h + '</span>'
}
async function setStars(id, n) { await api(API + '/' + id, { method: 'PATCH', body: JSON.stringify({ stars: n }) }); toast(`★ ${n}`); reload() }

function typeIcon(t) { return { image: '🖼️', audio: '🎵', video: '🎬', document: '📄', code: '💻', archive: '📦' }[t] || '📎' }

function previewHtml(r) {
  if (!r.exists) return '<span class="ico" title="文件缺失">🚫</span>'
  if (r.mime_type.startsWith('image/')) return `<img src="${API}/${r.id}/file" alt="" loading="lazy">`
  return `<span class="ico">${typeIcon(r.artifact_type)}</span>`
}

/* ── 标签芯片（2026-10-14 从主面板的 DetailDrawer 搬来）────────────────────
 * 受管标签表（`GET /managed-tags`）里有样式的标签 ⇒ 带颜色/字重的芯片；
 * 其余是素文本。**受管 ≠ 有样式**（受管但没配样式的照样是芯片，只是素净）。
 *
 * ⚠️ 三态**不许拍平**：
 *   · `managedTags === null`（还没拉到 / 拉失败）⇒ **不猜**，一律素文本，且**不报错**
 *     （网页版是独立页面，标签没样式不影响用；把"读不到"渲染成红字是过度反应）
 *   · `[]`（拉到了但表是空的）⇒ 也素文本，语义上不同但**渲染上一样**（都是没样式）
 *   ⇒ 这里**只影响观感**，所以两态可以同形；但**代码上必须分开取**，
 *     否则哪天要在界面上区分时会发现信息已经丢了。
 */
let managedTags = null
async function loadManagedTags() {
  try {
    const r = await api(API + '/managed-tags')
    managedTags = (r && r.ok === true && Array.isArray(r.tags)) ? r.tags : null
  } catch { managedTags = null }
  // ⚠️ 必须**重渲染一次**：首次 `reload()` 与它是并行的，那时 `managedTags` 还是 `null`
  //    ⇒ 全部标签都渲染成素文本，而且**之后没有任何东西会触发重渲染**。
  //    （2026-10-14 真机踩到：TAGCHIPS=0 / TAGFREE=273 —— 数据是对的，只是没重画。）
  render()
}

/** 归一化标签名（与规则层同口径：小写 + 去掉装饰性分隔符）。 */
function normTag(t) {
  return String(t || '').toLowerCase().replace(/[\s\u00b7\u30fb\u2027\u2219\u22c5\u2010\u2011\u2012\u2013\u2014\u2015\-_]+/gu, '')
}

function tagChipsHtml(tags) {
  if (!tags || !tags.length) return ''
  const table = Array.isArray(managedTags) ? managedTags : []
  const byKey = new Map(table.map((m) => [normTag(m.tag), m]))
  return '<div class="tagchips">' + tags.map((t) => {
    const m = byKey.get(normTag(t))
    if (!m) return `<span class="tagfree">${esc(t)}</span>`
    // 颜色/字重**只来自规则层**（不在这里自己判一遍）
    const cls = 'tagchip' + (m.color ? ' c-' + esc(m.color) : '') + (m.weight === 'bold' ? ' bold' : '')
    return `<span class="${cls}" title="${esc(m.tag)}">${esc(t)}</span>`
  }).join('') + '</div>'
}

function cardHtml(r) {
  return `<div class="card">
    <div class="thumb" onclick="openPreview('${r.id}')">${previewHtml(r)}</div>
    <div class="card-body">
      <div class="card-title"><input type="checkbox" class="alf-sel" onchange="toggleSel('${r.id}', this.checked)" ${state.selected.has(r.id) ? 'checked' : ''} style="width:auto;margin-right:6px;accent-color:var(--acc)">${esc(r.title)}</div>
      ${r.summary ? `<div class="card-summary">${esc(r.summary)}</div>` : ''}
      <div class="card-meta">
        <span class="badge${r.artifact_type === 'image' ? ' warm' : ''}">${typeIcon(r.artifact_type)} ${esc(r.artifact_type)}</span>
        ${r.kind === 'reference' ? '<span class="badge">📚 资料</span>' : ''}
        ${r.needsRefine ? '<span class="badge" style="color:var(--warm);border-color:var(--warm)">' + (r.refineRequested ? '⚡ 优先精化' : '待精化') + '</span>' : ''}
        ${r.project ? `<span class="badge">${esc(r.project)}</span>` : ''}
        ${r.session_id ? `<span class="badge" title="来源会话：${esc(r.session_id)}">🎬 ${esc(r.session_id.slice(0, 14))}</span>` : ''}
        ${r.status === 'archived' ? '<span class="badge archived">归档</span>' : ''}
        <span>${fmtSize(r.size_bytes)}</span>
      </div>
      ${starsHtml(r)}
      ${tagChipsHtml(r.tags)}
      ${r.notes ? `<div class="notes-line" title="${esc(r.notes)}">📝 ${esc(r.notes)}</div>` : ''}
      ${r.references && r.references.length ? `<div class="notes-line" title="${esc(refNames(r.references).join(', '))}">📚 资料: ${esc(refNames(r.references).join(', '))}</div>` : ''}
      <div class="card-actions">
        <button onclick="openPreview('${r.id}')">👁️ 预览</button>
        <button onclick="openEdit('${r.id}')">✏️ 编辑</button>
        <button onclick="openFolder('${r.id}')">📂 文件夹</button>
        <button onclick="copyPath('${r.id}')">📋 路径</button>
        ${state.trash
          ? `<button onclick="restoreOne('${r.id}')">↩️ 恢复</button><button class="danger" onclick="delOne('${r.id}')">🗑️ 删除</button>`
          : `<button class="danger" onclick="trashOne('${r.id}')">🗑️</button>`}
      </div>
    </div>
  </div>`
}

function listHtml(r) {
  return `<tr>
    <td>${r.mime_type.startsWith('image/') && r.exists ? `<img class="mini-thumb" src="${API}/${r.id}/file">` : `<span style="font-size:18px">${typeIcon(r.artifact_type)}</span>`}</td>
    <td><b>${esc(r.title)}</b><br><span style="color:var(--dim);font-size:11px">${esc(r.path)}</span></td>
    <td>${esc(r.project || '—')}</td>
    <td>${starsHtml(r)}</td>
    <td>${fmtSize(r.size_bytes)}</td>
    <td>${fmtDate(r.created_at)}</td>
    <td>${r.session_id ? `<span class="hint" title="${esc(r.session_id)}">${esc(r.session_id.slice(0, 14))}</span>` : '—'}</td>
    <td style="white-space:nowrap">
      <button onclick="openPreview('${r.id}')">预览</button>
      <button onclick="openEdit('${r.id}')">编辑</button>
      ${state.trash
        ? `<button onclick="restoreOne('${r.id}')">恢复</button><button class="danger" onclick="delOne('${r.id}')">删除</button>`
        : `<button class="danger" onclick="trashOne('${r.id}')">回收</button>`}
    </td>
  </tr>`
}

function render() {
  const c = $('content')

  // ⭐ 2026-10-14：文件 / 改动两个视图**不吃 state.items**（数据源不同）
  //    ⇒ 必须在「空库」那条兜底**之前**分流，否则空库时它们永远显示"库是空的"。
  if (state.view === 'files') { renderFiles(); return }
  if (state.view === 'changes') { renderChanges(); return }

  if (!state.items.length) {
    const hasFilter = $('q').value || $('fKind').value || $('fRefine').value || $('fProject').value || $('fType').value || $('fTag').value
    c.innerHTML = `<div class="empty">${state.trash ? '🗑️ 回收站是空的' : hasFilter ? '🔍 没有符合筛选条件的结果，试试清空筛选' : '✨ 库还是空的<br><br>点右上角「登记产物」手动登记，或让 Agent 调用 register_artifact；<br>也可以「📥 导入文件夹」把一批资料批量收进来'}</div>`
    return
  }
  // 分页：每页 pageSize 条，末尾「加载更多」
  const visible = state.items.slice(0, state.page * state.pageSize)
  const more = state.items.length > visible.length
  const moreBtn = more ? `<div style="text-align:center;margin:18px 0"><button onclick="loadMore()" style="padding:8px 24px">加载更多（还剩 ${state.items.length - visible.length} 条）</button></div>` : `<div class="hint" style="text-align:center;margin:14px 0">共 ${state.items.length} 条</div>`
  if (state.view === 'list') {
    c.innerHTML = `<table><thead><tr><th></th><th>产物</th><th>项目</th><th>星级</th><th>大小</th><th>登记时间</th><th>来源会话</th><th>操作</th></tr></thead><tbody>${visible.map(listHtml).join('')}</tbody></table>${moreBtn}`
  } else if (state.view === 'project') {
    const groups = {}
    for (const r of visible) (groups[r.project || '(未分类)'] = groups[r.project || '(未分类)'] || []).push(r)
    c.innerHTML = Object.entries(groups).map(([p, items]) =>
      `<div class="group"><h3>📁 ${esc(p)} <span class="count">${items.length} 件</span></h3><div class="cards">${items.map(cardHtml).join('')}</div></div>`).join('') + moreBtn
  } else {
    c.innerHTML = `<div class="cards">${visible.map(cardHtml).join('')}</div>${moreBtn}`
  }
}
function loadMore() { state.page++; render() }

/* ══════════════════════════════════════════════════════════════════════════
 * 文件视图（2026-10-14 新增 · 档 1d）
 * ══════════════════════════════════════════════════════════════════════════
 * 从**主面板的 `DirBrowser` + `FilesView`** 搬过来。面板删了 ⇒ 能力搬网页版。
 *
 * 两个模式（同一个视图里）：
 *   · **浏览** —— `GET /files/list?dir=`，逐层进目录（面包屑 + 上级）
 *   · **搜索** —— `GET /files?q=&limit=`，Everything 语法（`ext:md` / `dm:today` …）
 *
 * ⚠️ **路径必须过宿主闸门**：`/files/list` 会 `assertInScope`，
 *    范围外的目录回 403 —— 这里**如实显示宿主的理由**，不自己编一句。
 * ⚠️ 面包屑按**分隔符**切（Windows 上 `\` 与 `/` 混用）—— 与 `store.js`
 *    的 `inScopeDir` 同一个教训：不归一化就会把同一目录判成不同目录。
 * ══════════════════════════════════════════════════════════════════════════ */

/** 把路径切成面包屑（兼容 `\` 与 `/`，并保留盘符）。 */
function crumbsOf(p) {
  const s = String(p || '')
  if (!s) return []
  const parts = s.split(/[\\/]+/).filter(Boolean)
  const out = []
  let acc = ''
  parts.forEach((seg, i) => {
    // 第一段若是盘符（`C:`），接上分隔符；其余每段都加分隔符
    acc = i === 0 ? seg : acc + '\\' + seg
    out.push({ name: seg, path: acc })
  })
  return out
}

/** 父目录（已经是根时返回空串）。 */
function parentOf(p) {
  const s = String(p || '').replace(/[\\/]+$/, '')
  const i = Math.max(s.lastIndexOf('\\'), s.lastIndexOf('/'))
  if (i < 0) return ''
  const head = s.slice(0, i)
  return /^[A-Za-z]:$/.test(head) ? head + '\\' : head
}

async function loadDir(dir) {
  state.files.loading = true
  state.files.error = ''
  render()
  try {
    const r = await api(API + '/files/list?dir=' + encodeURIComponent(dir))
    state.files.dir = dir
    state.files.entries = r.entries || []
    state.files.total = r.total || 0
    state.files.truncated = !!r.truncated
  } catch (e) {
    // ⚠️ 宿主的理由原样带出来（403 out-of-scope 的文案在 e.message 里）
    state.files.error = e && e.message ? e.message : String(e)
    state.files.entries = []
  } finally {
    state.files.loading = false
    render()
  }
}

async function searchFiles() {
  const q = state.fileQuery.trim()
  if (!q) { state.fileResults = null; render(); return }
  state.fileSearching = true
  render()
  try {
    const r = await api(API + '/files?q=' + encodeURIComponent(q) + '&limit=200')
    state.fileResults = (r && r.hits) || (Array.isArray(r) ? r : [])
    state.fileResultsError = (r && r.ok === false) ? (r.error || '搜索失败') : ''
  } catch (e) {
    state.fileResults = []
    state.fileResultsError = e && e.message ? e.message : String(e)
  } finally {
    state.fileSearching = false
    render()
  }
}

function renderFiles() {
  const c = $('content')
  const f = state.files
  const searching = state.fileQuery.trim() !== '' || state.fileResults !== null

  const bar = `<div class="files-bar">
    <input class="grow" id="fq" placeholder="搜索文件（Everything 语法：ext:md / dm:today / size:>10mb）"
      value="${esc(state.fileQuery)}"
      onkeydown="if(event.key==='Enter'){state.fileQuery=this.value;searchFiles()}">
    <button onclick="state.fileQuery=$('fq').value;searchFiles()">搜索</button>
    ${searching ? `<button class="ghost" onclick="state.fileQuery='';state.fileResults=null;render()">返回浏览</button>` : ''}
  </div>`

  if (searching) {
    if (state.fileSearching) { c.innerHTML = bar + `<div class="empty">搜索中…</div>`; return }
    const hits = state.fileResults || []
    if (!hits.length) {
      c.innerHTML = bar + `<div class="empty">${state.fileResultsError ? '搜索失败：' + esc(state.fileResultsError) : '没有找到匹配的文件。<br><br>试试 <code>ext:md</code> 或 <code>dm:today</code>；<br>⚠️ 搜索依赖 Everything 索引，索引没起来时会搜不到。'}</div>`
      return
    }
    c.innerHTML = bar + `<div class="hint" style="margin:10px 0">找到 ${hits.length} 个文件</div>` +
      `<table><thead><tr><th>文件</th><th>大小</th><th>修改时间</th><th>操作</th></tr></thead><tbody>` +
      hits.map((h) => {
        const p = h.path || h.fullPath || ''
        return `<tr><td class="mono" title="${esc(p)}">${esc(p)}</td>` +
          `<td>${h.size != null ? fmtSize(h.size) : '—'}</td>` +
          `<td>${h.mtimeMs || h.modified ? fmtDate(Math.floor((h.mtimeMs || h.modified * 1000) / 1000)) : '—'}</td>` +
          `<td><button class="ghost" onclick="revealPath('${esc(p).replace(/'/g, "\\'")}')">📂 定位</button></td></tr>`
      }).join('') + `</tbody></table>`
    return
  }

  // ── 浏览模式 ──────────────────────────────────────────────────────────
  if (f.error) {
    c.innerHTML = bar + `<div class="empty">⚠️ 打不开这个目录：${esc(f.error)}<br><br>` +
      `<span class="hint">宿主只放行<b>索引范围内</b>的路径。范围外的目录会被 403 挡下（这是设计，不是 bug）。</span></div>`
    return
  }
  if (!f.dir) {
    c.innerHTML = bar + `<div class="empty">输入一个<b>绝对路径</b>开始浏览，或用上面的搜索框。<br><br>` +
      `<button onclick="loadDir('${esc((state.workspaceHint || '').replace(/'/g, "\\'"))}')">用当前工作区</button></div>`
    return
  }

  const crumbs = crumbsOf(f.dir)
  const crumbHtml = `<div class="crumbs">` +
    `<button class="ghost" onclick="loadDir('${esc(parentOf(f.dir)).replace(/'/g, "\\'")}')" ${parentOf(f.dir) === f.dir ? 'disabled' : ''}>↑ 上级</button>` +

  }

  // ⚠️ 「真的空」与「被截断」是两件事（§六 的同一条教训）
  const note = f.truncated
    ? `<div class="hint" style="margin:10px 0">⚠️ 只列了前 ${f.entries.length} 项（共 ${f.total} 项）—— 宿主设了单次上限。</div>`
    : `<div class="hint" style="margin:10px 0">共 ${f.entries.length} 项</div>`

  c.innerHTML = bar + crumbHtml + note +
    `<table><thead><tr><th></th><th>名称</th><th>大小</th><th>修改时间</th><th>操作</th></tr></thead><tbody>` +
    f.entries.map((e) => {
      const p = e.path || ''
      const isDir = !!e.isDirectory
      return `<tr><td>${isDir ? '📁' : '📄'}</td>` +
        `<td>${isDir
          ? `<a href="#" onclick="event.preventDefault();loadDir('${esc(p).replace(/'/g, "\\'")}')">${esc(e.name)}</a>`
          : `<span class="mono" title="${esc(p)}">${esc(e.name)}</span>`}</td>` +
        `<td>${e.size != null ? fmtSize(e.size) : '—'}</td>` +
        `<td>${e.mtimeMs ? fmtDate(Math.floor(e.mtimeMs / 1000)) : '—'}</td>` +
        `<td><button class="ghost" onclick="revealPath('${esc(p).replace(/'/g, "\\'")}')">📂 定位</button></td></tr>`
    }).join('') + `</tbody></table>`
}

/* ══════════════════════════════════════════════════════════════════════════
 * 改动视图（2026-10-14 新增 · 档 1d）
 * ══════════════════════════════════════════════════════════════════════════
 * 从**主面板的 `ChangesView`** 搬过来。
 *
 * ⚠️ **宿主没有「用户正在看哪个会话」这个概念** ⇒ 只能走 `?recent=1`
 *    （宿主自取「最近一次 workspace/changes 公告」），响应带 `derived: true`。
 *    界面上**必须标出来**这是「最近改动 · 会话 <id>」，**不许说成「当前会话」**。
 * ⚠️ 从没观察到公告 → 404 `nothing-observed` ⇒ **如实说「还没观察到」**，
 *    **绝不回落到「最近修改的文件」凑数**（那是另一种更隐蔽的骗人）。
 * ══════════════════════════════════════════════════════════════════════════ */
async function loadChanges() {
  state.changes.status = 'loading'
  render()
  try {
    const r = await api(API + '/session-changes?recent=1')
    state.changes.status = 'ready'
    state.changes.items = (r && r.files) || []
    state.changes.derived = !!(r && r.derived)
    state.changes.sessionId = (r && r.sessionId) || ''
    state.changes.error = ''
  } catch (e) {
    const msg = e && e.message ? e.message : String(e)
    // 404 nothing-observed 是**正常状态**，不是错误 —— 分开说
    if (/nothing-observed|还没观察到/.test(msg)) {
      state.changes.status = 'none'
      state.changes.error = ''
    } else {
      state.changes.status = 'error'
      state.changes.error = msg
    }
    state.changes.items = []
  }
  render()
}

function renderChanges() {
  const c = $('content')
  const ch = state.changes
  if (ch.status === 'idle') { loadChanges(); c.innerHTML = `<div class="empty">读取中…</div>`; return }
  if (ch.status === 'loading') { c.innerHTML = `<div class="empty">读取中…</div>`; return }
  if (ch.status === 'error') {
    c.innerHTML = `<div class="empty">⚠️ 读不到改动：${esc(ch.error)}<br><br>` +
      `<button onclick="loadChanges()">重试</button></div>`
    return
  }
  if (ch.status === 'none') {
    c.innerHTML = `<div class="empty">插件启动以来<b>还没观察到任何改动公告</b>。<br><br>` +
      `<span class="hint">这不是错误：改动来自宿主的 <code>workspace/changes</code> 事件，<br>` +
      `会话里改过文件之后才会有。</span><br><br><button onclick="loadChanges()">重新读取</button></div>`
    return
  }
  if (!ch.items.length) {
    c.innerHTML = `<div class="empty">这一轮没有文件改动。</div><div style="text-align:center"><button onclick="loadChanges()">重新读取</button></div>`
    return
  }
  // ⚠️ 必须标 derived：这是「最近一次公告」，不是「当前会话」
  const head = ch.derived
    ? `<div class="hint" style="margin:10px 0">⚠️ 这是<b>最近一次改动公告</b>（不是"当前会话"——宿主没有这个概念）` +
      `${ch.sessionId ? ' · 会话 <code>' + esc(String(ch.sessionId).slice(0, 12)) + '…</code>' : ''}。</div>`
    : `<div class="hint" style="margin:10px 0">共 ${ch.items.length} 个改动文件</div>`
  c.innerHTML = head + `<table><thead><tr><th>文件</th><th>增/删</th><th>轮次</th><th>操作</th></tr></thead><tbody>` +
    ch.items.map((f) => {
      const p = f.path || f.file || ''
      const add = f.added != null ? f.added : (f.additions != null ? f.additions : '')
      const del = f.removed != null ? f.removed : (f.deletions != null ? f.deletions : '')
      return `<tr><td class="mono" title="${esc(p)}">${esc(p)}</td>` +
        `<td>${add !== '' ? '+' + add : ''} ${del !== '' ? '−' + del : ''}</td>` +
        `<td>${f.turn != null ? f.turn : '—'}</td>` +
        `<td><button class="ghost" onclick="revealPath('${esc(p).replace(/'/g, "\\'")}')">📂 定位</button></td></tr>`
    }).join('') + `</tbody></table>` +
    `<div style="text-align:center;margin:14px 0"><button onclick="loadChanges()">重新读取</button></div>`
}

let zoom = { s: 1, x: 0, y: 0 }
function applyZoom() { const img = $('lbImg'); if (img) img.style.transform = `translate(${zoom.x}px, ${zoom.y}px) scale(${zoom.s})`; const pct = $('zoomPct'); if (pct) pct.textContent = Math.round(zoom.s * 100) + '%' }
function zoomBy(f) { zoom.s = Math.max(0.2, Math.min(8, zoom.s * f)); applyZoom() }
function zoomReset() { zoom = { s: 1, x: 0, y: 0 }; applyZoom() }
function zoomActual() { zoom = { s: 1, x: 0, y: 0 }; applyZoom() }
function setRate(v) { const av = $('lbAudio') || $('lbVideo'); if (av) av.playbackRate = Number(v); const el = $('lbRateVal'); if (el) el.textContent = Number(v).toFixed(2) + 'x' }

async function openPreview(id) {
  const r = await api(API + '/' + id)
  const lb = $('lightbox'); const body = $('lbBody'); const meta = $('lbMeta')
  body.innerHTML = ''
  meta.innerHTML = `<b>${esc(r.title)}</b> · <a href="javascript:void(0)" style="color:var(--acc2)" onclick="openFolder('${r.id}')" title="在文件管理器中打开">${esc(r.path)}</a><br>${esc(r.summary || '')}${r.references && r.references.length ? '<br>📚 用了资料: ' + esc(refNames(r.references).join('、')) : ''}`
  zoomReset()
  if (!r.exists) body.innerHTML = '<div class="empty">🚫 文件缺失：' + esc(r.path) + '</div>'
  else if (r.mime_type.startsWith('image/')) {
    body.innerHTML =
      `<div class="lb-stage" id="lbStage"><img id="lbImg" src="${API}/${id}/file" alt=""></div>
       <div class="lb-controls">
         <button onclick="zoomBy(1.25)">🔍＋</button>
         <button onclick="zoomBy(0.8)">🔍－</button>
         <button onclick="zoomReset()">适应</button>
         <button onclick="zoomActual()">1:1</button>
         <span class="pct" id="zoomPct">100%</span>
         <span style="color:var(--dim);font-size:12px">滚轮缩放 · 拖拽平移 · 双击复位</span>
       </div>`
    const stage = $('lbStage'); const img = $('lbImg')
    const drag = { on: false, sx: 0, sy: 0, ox: 0, oy: 0, pid: null }
    stage.addEventListener('wheel', (e) => { e.preventDefault(); const f = e.deltaY < 0 ? 1.15 : 0.87; zoom.s = Math.max(0.2, Math.min(8, zoom.s * f)); applyZoom() }, { passive: false })
    // Pointer Events + 指针捕获：窗口外松开也能收到 pointerup，且监听器随 stage 销毁无泄漏
    stage.addEventListener('pointerdown', (e) => {
      drag.on = true; drag.pid = e.pointerId; drag.sx = e.clientX; drag.sy = e.clientY; drag.ox = zoom.x; drag.oy = zoom.y
      stage.classList.add('dragging')
      try { stage.setPointerCapture(e.pointerId) } catch { /* ignore */ }
    })
    stage.addEventListener('pointermove', (e) => {
      if (!drag.on || e.pointerId !== drag.pid) return
      zoom.x = drag.ox + (e.clientX - drag.sx)
      zoom.y = drag.oy + (e.clientY - drag.sy)
      applyZoom()
    })
    stage.addEventListener('pointerup', (e) => { if (e.pointerId !== drag.pid) return; drag.on = false; stage.classList.remove('dragging') })
    stage.addEventListener('pointercancel', (e) => { if (e.pointerId !== drag.pid) return; drag.on = false; stage.classList.remove('dragging') })
    // 双击复位/放大：挂在 stage（指针捕获会把合成事件重定向到捕获目标，挂 img 收不到）
    stage.addEventListener('dblclick', () => { zoom.s > 1.05 ? zoomReset() : zoomBy(2) })
  }
  else if (r.mime_type.startsWith('video/')) {
    body.innerHTML = `<video controls id="lbVideo" src="${API}/${id}/file"></video>
      <div class="lb-rate"><span>⏩ 倍速</span><input type="range" min="0.5" max="2" step="0.05" value="1" oninput="setRate(this.value)"><b id="lbRateVal">1.00x</b></div>`
  }
  else if (r.mime_type.startsWith('audio/')) {
    body.innerHTML = `<audio controls id="lbAudio" src="${API}/${id}/file"></audio>
      <div class="lb-rate"><span>⏩ 倍速</span><input type="range" min="0.5" max="2" step="0.05" value="1" oninput="setRate(this.value)"><b id="lbRateVal">1.00x</b></div>`
  }
  else { const t = await fetch(API + '/' + id + '/file').then((x) => x.text()).catch(() => '(无法读取)'); body.innerHTML = `<pre>${esc(t.slice(0, 20000))}</pre>` }
  lb.style.display = 'flex'
}

    box.innerHTML = r.hits.map((h, i) => `<div class="sem-hit" onclick="gotoSemHit('${h.id}')">
      <div class="t">${i + 1}. ${h.kind === 'reference' ? '📚' : '📦'} ${esc(h.title)} <span class="k">${esc(h.project)}</span><span class="k">相关度 ${h.score}</span>${h.needsRefine ? '<span class="k" style="color:var(--warm)">待精化</span>' : ''}</div>
      <div class="m">命中词：${esc(h.matched.join('、'))}${h.summary ? '<br>' + esc(h.summary.slice(0, 120)) : ''}</div>
    </div>`).join('')
  } catch (e) { box.innerHTML = `<div class="hint">❌ ${esc(e.message)}</div>` }
}
function gotoSemHit(id) {
  // 直接打开预览看内容，比编辑弹窗更直观
  closeModal('semanticModal')
  openPreview(id)
}

// === v0.3：整理建议单（C2）===
async function openCleanupSuggest() {
  $('cleanupModal').classList.add('open')
  await refreshCleanupBody()
}
async function refreshCleanupBody() {
  const box = $('cleanupBody')
  box.innerHTML = '<div class="hint">扫描中…</div>'
  try {
    const s = await api(API + '/suggest-cleanup')
    const html = []
    html.push(`<div class="cleanup-group"><h4>🔁 重复记录（${s.duplicates.length} 组）</h4>`)
    if (!s.duplicates.length) html.push('<div class="hint">无重复</div>')
    for (const d of s.duplicates.slice(0, 8)) {
      html.push(`<div class="cleanup-item"><div class="grow">${esc(d.path.split(/[\\/]/).pop())}<br><span class="hint">保留 ${esc(d.keepTitle)}，重复 ${d.dupIds.length} 条</span></div><button onclick="applyDedup('${d.keepId}','${d.dupIds.join(',')}')">归档重复</button></div>`)
    }
    html.push('</div>')
    html.push(`<div class="cleanup-group"><h4>🚫 文件缺失（${s.missing.length} 条）</h4>`)
    if (!s.missing.length) html.push('<div class="hint">无缺失</div>')
    else {
      html.push('<div class="hint">文件已不在原位置：整理只能刷新状态、找不回文件。确认不要了可归档记录（文件本身不动）。</div>')
      html.push('<div class="cleanup-item"><div class="grow">批量处理</div><button onclick="archiveMissing()">归档全部缺失记录</button></div>')
    }
    for (const m of s.missing.slice(0, 6)) {
      html.push(`<div class="cleanup-item"><div class="grow">${esc(m.title)}<br><span class="hint">${esc(m.path)}</span></div><button onclick="archiveOne('${m.id}')">归档</button><button onclick="trashOne('${m.id}')">回收</button></div>`)
    }
    html.push('</div>')
    html.push(`<div class="cleanup-group"><h4>⚡ 待精化（${s.unrefinedCount} 条）</h4>`)
    if (!s.unrefinedCount) html.push('<div class="hint">全部已精化 ✨</div>')
    else html.push(`<div class="hint">共 ${s.unrefinedCount} 条缺摘要/标签，可点右上角「🚀 立即精炼」交给 AI 补全。</div>`)
    html.push('</div>')
    html.push(`<div class="cleanup-group"><h4>🗄️ 僵尸项目（${s.staleProjects.length} 个，仅提示）</h4>`)
    if (!s.staleProjects.length) html.push('<div class="hint">无</div>')
    for (const p of s.staleProjects.slice(0, 5)) html.push(`<div class="cleanup-item"><div class="grow">${esc(p.project)}（${p.count} 条全部归档）</div></div>`)
    html.push('</div>')
    box.innerHTML = html.join('')
  } catch (e) { box.innerHTML = `<div class="hint">❌ ${esc(e.message)}</div>` }
}
async function applyDedup(keepId, dupIdsCsv) {
  const dupIds = dupIdsCsv.split(',').filter(Boolean)
  try {
    for (const id of dupIds) await api(API + '/' + id, { method: 'PATCH', body: JSON.stringify({ status: 'archived' }) })
    toast(`✅ 已归档 ${dupIds.length} 条重复，保留 ${keepId.slice(0, 8)}…`)
    await refreshCleanupBody(); reload()
  } catch (e) { toast('❌ ' + e.message) }
}
async function archiveOne(id) {
  try {
    await api(API + '/' + id, { method: 'PATCH', body: JSON.stringify({ status: 'archived' }) })
    toast('✅ 已归档该记录（文件本身不动）')
    await refreshCleanupBody(); reload()
  } catch (e) { toast('❌ ' + e.message) }
}
async function archiveMissing() {
  try {
    const s = await api(API + '/suggest-cleanup')
    const ids = (s.missing || []).map((m) => m.id)
    if (!ids.length) return toast('没有缺失记录')
    for (const id of ids) await api(API + '/' + id, { method: 'PATCH', body: JSON.stringify({ status: 'archived' }) })
    toast(`✅ 已归档 ${ids.length} 条缺失记录（文件本身不动）`)
    await refreshCleanupBody(); reload()
  } catch (e) { toast('❌ ' + e.message) }
}
async function copyPath(id) { const r = await api(API + '/' + id); try { await navigator.clipboard.writeText(r.path); toast('📋 路径已复制') } catch { prompt('复制路径：', r.path) } }
async function trashOne(id) { await api(API + '/' + id + '/trash', { method: 'POST' }); undoToast('🗑️ 已移入回收站', async () => { await api(API + '/' + id + '/restore', { method: 'POST' }); reload() }); reload() }
async function restoreOne(id) { await api(API + '/' + id + '/restore', { method: 'POST' }); toast('✅ 已恢复'); reload() }
async function delOne(id) {
  const r = await api(API + '/' + id)
  if (!confirm('永久删除该记录？（文件本身不动）')) return
  await api(API + '/' + id, { method: 'DELETE' })
  undoToast('🗑️ 已永久删除', async () => {
    await api(API, { method: 'POST', body: JSON.stringify({ path: r.path, title: r.title, summary: r.summary, project: r.project, deliverable: r.deliverable, artifact_type: r.artifact_type, tags: r.tags, notes: r.notes, status: r.status, kind: r.kind, stars: r.stars }) })
    reload()
  })
  reload()
}

// === 批量操作 ===
async function batchTrash() {
  const ids = [...state.selected]; if (!ids.length) return toast('请先勾选条目')
  for (const id of ids) await api(API + '/' + id + '/trash', { method: 'POST' })
  toast(`🗑️ 已回收 ${ids.length} 条（可到回收站恢复）`); state.selected.clear(); updateSelBar(); reload()
}
async function batchProject() {
  const ids = [...state.selected]; if (!ids.length) return toast('请先勾选条目')
  const project = prompt('把这些条目归到哪个项目？', $('fProject').value || '')
  if (project === null) return
  for (const id of ids) await api(API + '/' + id, { method: 'PATCH', body: JSON.stringify({ project }) })
  toast(`📁 已把 ${ids.length} 条归入「${project}」`); state.selected.clear(); updateSelBar(); reload()
}
async function batchTags() {
  const ids = [...state.selected]; if (!ids.length) return toast('请先勾选条目')
  const tagStr = prompt('要追加的标签（逗号分隔）：', '')
  if (!tagStr) return
  const newTags = tagStr.split(',').map((s) => s.trim()).filter(Boolean)
  for (const id of ids) {
    const r = await api(API + '/' + id)
    const merged = [...(r.tags || []), ...newTags.filter((t) => !(r.tags || []).includes(t))]
    await api(API + '/' + id, { method: 'PATCH', body: JSON.stringify({ tags: merged }) })
  }
  toast(`🏷️ 已为 ${ids.length} 条追加标签`); state.selected.clear(); updateSelBar(); reload()
}

// === 快捷键 ===
document.addEventListener('keydown', (e) => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '')
  if (e.key === 'Escape') { closeLb(); closeModal('regModal'); closeModal('editModal'); closeModal('importModal'); closeModal('settingsModal'); closeModal('refineModal'); closeModal('semanticModal'); closeModal('cleanupModal'); return }
  if (typing) return
  if (e.key === '/') { e.preventDefault(); $('q').focus(); return }
  if (e.key === 'n' || e.key === 'N') { openRegister(); return }
  if (e.key === 'g' || e.key === 'G') { toggleTrash(); return }
  if (e.key === '1') { setView('list'); return }
  if (e.key === '2') { setView('card'); return }
  if (e.key === '3') { setView('project'); return }
})
;(async () => { try { await Promise.all([loadMeta(), refreshRefIndex(), reload(), loadManagedTags()]) } catch (e) { $('content').innerHTML = `<div class="empty">加载失败：${esc(e.message)}（插件是否已安装并重启 dsh？）</div>` } })()
</script>
