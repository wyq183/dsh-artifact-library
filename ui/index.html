<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>产物库 · DeepSeek Harness</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#2a3242;
    --fg:#e6edf3; --dim:#8b98a9; --acc:#4da3ff; --acc2:#79c0ff;
    --warm:#ffb86c; --star:#ffd166; --ok:#3fb950; --danger:#f85149;
    --radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;padding:20px;max-width:1200px;margin:0 auto}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  header h1{font-size:20px;font-weight:700;letter-spacing:.5px}
  header h1 .dot{color:var(--acc2)}
  .stats{display:flex;gap:10px;flex-wrap:wrap}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 12px;font-size:12px;color:var(--dim)}
  .stat b{color:var(--fg)}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  input,select,button{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:7px 12px;font-size:13px;outline:none}
  input:focus,select:focus{border-color:var(--acc)}
  button{cursor:pointer;transition:.15s}
  button:hover{border-color:var(--acc)}
  button.primary{background:var(--acc);border-color:var(--acc);color:#04121f;font-weight:600}
  button.primary:hover{background:var(--acc2)}
  button.danger{color:var(--danger);border-color:var(--danger)}
  button.ghost{background:transparent}
  .grow{flex:1}
  .view-switch{display:flex;gap:4px}
  .view-switch button{padding:6px 14px}
  .view-switch button.active{background:var(--acc);border-color:var(--acc);color:#04121f;font-weight:600}
  .sep{width:1px;height:24px;background:var(--line)}
  /* 卡片视图 */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:.15s}
  .card:hover{border-color:var(--acc);transform:translateY(-2px)}
  .thumb{height:130px;background:var(--panel2);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .thumb .ico{font-size:34px;opacity:.5}
  .card-body{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
  .card-title{font-weight:600;word-break:break-all}
  .card-summary{color:var(--dim);font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card-meta{font-size:11px;color:var(--dim);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .badge{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:1px 8px;font-size:11px}
  .badge.warm{border-color:var(--warm);color:var(--warm)}
  .badge.archived{color:var(--dim)}
  .card-actions{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--line)}
  .card-actions button{font-size:12px;padding:4px 10px}
  /* 列表视图 */
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
  th{color:var(--dim);font-weight:600;font-size:12px;background:var(--panel2)}
  tr:hover td{background:var(--panel2)}
  td /* ══ 列表表格：可拖列宽 + 可拖行高（2026-10-19 第 3 步）══════════════════
   ⚠️ `table-layout:fixed` 必须开：否则浏览器会按内容重新分配列宽，
      <colgroup> 里设的 width 会被"参考"而不是"遵守"——拖了会弹回去。
   ⚠️ 行高用 CSS 变量 `--row-h`（表格上设），td 的 height 跟着它走；
      缩略图 `height: calc(var(--row-h) - 16px)` ⇒ 行高拖大，图跟着变大。 */
.pvtable{table-layout:fixed;width:100%}
.pvtable td{padding:8px 10px;height:var(--row-h,56px)}
.pvtable th.pvth{position:sticky;top:0;z-index:2;padding:8px 10px}
/* 表头里的列宽把手：视觉是 1px 细线，**可点区 10px**（1px 鼠标抓不住） */
.colgrip{position:absolute;top:-8px;right:-5px;width:10px;height:calc(100% + 16px);cursor:col-resize;z-index:3}
.colgrip::after{content:'';position:absolute;top:0;left:4px;width:1px;height:100%;background:var(--line)}
.colgrip:hover::after{background:var(--acc);width:2px;left:4px}
/* ⚠️ th 必须 position:relative 才能让把手贴在自己右边缘 */
.pvtable th.pvth{position:relative;overflow:visible}
/* 行高把手：表头下方的一整行（横跨所有列）
   ⚠️ 常态显示一条细线 + 淡淡的手柄提示，hover 变蓝 ——
      依琪已经因为"看不见分割线"抱怨过两次，不许再藏到 hover 才出现。 */
.rowgripr th.rowgripth{height:10px;padding:0;cursor:row-resize;background:var(--panel2);border-bottom:1px solid var(--line);position:relative}
.rowgripr th.rowgripth::after{content:'';position:absolute;left:0;right:0;top:4px;height:2px;background:var(--line);border-radius:1px}
.rowgripr th.rowgripth:hover::after{background:var(--acc)}
.rowgriplab{font-size:11px;color:var(--dim);opacity:.55;pointer-events:none;line-height:10px;display:block;text-align:center}
.rowgripr th.rowgripth:hover .rowgriplab{opacity:1;color:var(--acc)}
/* 缩略图：跟着行高变 */
.mini-thumb{width:52px;height:36px;object-fit:cover;border-radius:6px;display:block;background:var(--panel2)}
.pvtable .mini-thumb{width:52px;height:calc(var(--row-h,56px) - 22px);min-height:18px}
.pvtype{font-size:18px;display:inline-block}
/* 图标列：缩略图变大时不能把列撑开 */
.pvico{overflow:hidden}
.mini-thumb{width:52px;height:36px;object-fit:cover;border-radius:6px;display:block;background:var(--panel2)}
  /* 项目视图 */
  .group{margin-bottom:18px}
  .group h3{font-size:15px;margin-bottom:10px;color:var(--acc2);display:flex;align-items:center;gap:8px}
  .group h3 .count{color:var(--dim);font-size:12px}
  .stars{color:var(--star);cursor:pointer;letter-spacing:2px;user-select:none}
  /* 预览 */
  #lightbox{position:fixed;inset:0;background:rgba(5,8,14,.92);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:99;padding:30px}
  #lightbox img{max-width:90vw;max-height:80vh;border-radius:8px}
  #lightbox pre{max-width:90vw;max-height:70vh;overflow:auto;background:var(--panel);padding:16px;border-radius:8px;white-space:pre-wrap;word-break:break-all}
  #lightbox video{max-width:90vw;max-height:70vh}
  #lightbox .close{position:absolute;top:18px;right:24px;font-size:26px;cursor:pointer;color:var(--dim)}
  #lightbox .meta{color:var(--dim);font-size:13px;max-width:80vw;text-align:center}
  .lb-stage{position:relative;max-width:90vw;max-height:76vh;overflow:hidden;background:rgba(0,0,0,.4);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:grab}
  .lb-stage.dragging{cursor:grabbing}
  .lb-stage img{max-width:88vw;max-height:72vh;transition:transform .08s ease-out;user-select:none;-webkit-user-drag:none}
  .lb-stage.dragging img{transition:none}
  .lb-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
  .lb-controls button{font-size:12px;padding:3px 12px}
  .lb-controls .pct{font-size:12px;color:var(--dim);min-width:52px;text-align:center}
  .lb-rate{display:flex;gap:10px;align-items:center;color:var(--dim);font-size:13px}
  .lb-rate input[type=range]{width:200px;accent-color:var(--acc)}
  .lb-rate b{color:var(--fg);min-width:44px;text-align:center}
  /* 弹窗 */
  .modal{position:fixed;inset:0;background:rgba(5,8,14,.75);display:none;align-items:center;justify-content:center;z-index:98;padding:20px}
  .modal.open{display:flex}
  .modal-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:100%;max-width:560px;max-height:86vh;overflow:auto;padding:22px}
  .modal-box h2{font-size:16px;margin-bottom:16px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;color:var(--dim);margin-bottom:4px}
  .field input,.field textarea,.field select{width:100%}
  .field textarea{resize:vertical;min-height:60px}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
  .empty{color:var(--dim);text-align:center;padding:50px 0}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 18px;font-size:13px;display:none;z-index:100}
  .toast.show{display:block}
  .notes-line{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
  .trash-bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  /* v0.3：语义搜索 / 整理建议 / 相关建议 */
  .sem-hit{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:.15s}
  .sem-hit:hover{border-color:var(--acc)}
  .sem-hit .t{font-weight:600}
  .sem-hit .m{color:var(--dim);font-size:12px;margin-top:2px}
  .sem-hit .k{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:0 8px;font-size:11px;color:var(--acc2);margin-right:4px}
  .sugg-item{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:8px}
  .sugg-item .grow{flex:1}
  .sugg-item .why{color:var(--dim);font-size:12px}
  .cleanup-group{margin-bottom:14px}
  .cleanup-group h4{font-size:13px;color:var(--acc2);margin-bottom:8px}
  .cleanup-item{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:6px;font-size:13px}
  .cleanup-item .grow{flex:1}
  .hint{color:var(--dim);font-size:12px}
/* ── 文件 / 改动视图（2026-10-14 新增 · 档 1d）──────────────────────────
   从主面板的 DirBrowser / FilesView / ChangesView 搬来。
   颜色只用既有 token（--fg/--dim/--line/--panel…），不新造变量。 */
.files-bar{display:flex;gap:8px;align-items:center;margin:10px 0 4px}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0;font-size:13px}
.crumb{color:var(--acc);cursor:pointer}
.crumb:hover{text-decoration:underline}
.crumb-sep{color:var(--dim)}
.crumb-on{font-weight:600;text-decoration:underline}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;word-break:break-all}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;background:var(--panel2);padding:1px 5px;border-radius:4px}
/* ── 标签芯片（2026-10-14 从主面板 DetailDrawer 搬来）────────────────────
   受管标签带颜色/字重；自由词素文本。**受管 ≠ 有样式**（受管没配样式的也是芯片）。
   颜色按规则层的 8 个槽名映射到既有 token —— 不写 hex（写死就不跟随主题）。 */
.tagchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;line-height:16px;margin:6px 0}
.tagchip{border:1px solid var(--line);border-radius:999px;padding:1px 9px;background:var(--panel2);color:var(--fg)}
.tagchip.bold{font-weight:600}
.tagfree{color:var(--dim);padding:1px 4px}
/* 可点标签（2026-10-19）：点一下 = 按这个标签筛。
   ⚠️ 要看起来"能点"：光标 + hover 描边。不做这两样的话，
      用户永远不知道标签是可操作的（今晚我已经在别的按钮上栽过一次）。 */
.filterbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 12px}
  .fchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--acc);border-radius:999px;padding:2px 4px 2px 10px;font-size:12px;line-height:18px;background:var(--panel2)}
  .fchiplab{color:var(--dim)}
  .fchiptxt{color:var(--fg);font-weight:600;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fchipx{border:0;background:transparent;color:var(--dim);cursor:pointer;font:inherit;padding:0 4px;line-height:18px;border-radius:999px}
  .fchipx:hover{color:var(--danger,#f87171)}
  .fchipall{border:1px solid var(--line);background:transparent;color:var(--dim);border-radius:999px;padding:2px 10px;font:inherit;font-size:12px;cursor:pointer}
  .fchipall:hover{border-color:var(--acc);color:var(--acc)}
  /* 列表里的标签格。
     ⚠️ 2026-10-19 真机修：第一版只写了 `max-width`，结果表格**自动布局**把这一列
        压到很窄 ⇒ 每个标签都被迫换行，一行撑成 7 行高（截图里看得清清楚楚）。
        ⇒ 必须给 `<td>` 一个**明确宽度**（`width` 而不是 `max-width`），
          表格才会真的给它那么宽。 */
  .listtags{width:200px}
  .listtags .tagchips{margin:0;gap:3px;flex-wrap:wrap}
  .listtags .tagchip,.listtags .tagfree{font-size:11px;line-height:15px;padding:0 6px;white-space:nowrap}
  /* ── 多选下拉（2026-10-19 第 4 步 · 与侧栏同一视觉语言）───────────── */
/* ⚠️ 容器 relative：弹层绝对定位相对它 */
/* 「只看未精炼」开关（2026-10-19）
   ⚠️ 形状上就是个 toggle：未开=灰边，开了=蓝边+蓝点。不用 checkbox 是因为
      它旁边还有 4 个下拉，checkbox 在视觉上会显得"更小一级"。 */
.togglebtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--dim);font:inherit;font-size:13px;line-height:20px;padding:6px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.togglebtn:hover{border-color:var(--acc)}
.togglebtn.on{border-color:var(--acc);color:var(--fg);background:var(--panel2)}
.tgl-dot{flex:none;font-size:11px;color:var(--dim);transition:.15s}
.togglebtn.on .tgl-dot{color:var(--acc)}
.togglebtn:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
/* 「已精炼」标签（2026-10-19）
   ⚠️ 它会出现在**多数行**上（424/448）⇒ 必须是"扫读时不存在、细看时找得到"的形态：
      · 无边框无背景（有的话会变成一排小盒子，抢注意力）
      · muted 色 + 11px
      · 与标题留 6px 间距，垂直居中对齐
   这是"打标记"与"满屏噪音"之间的那个点。 */
.refined{display:inline-block;margin-left:6px;font-size:11px;line-height:16px;color:var(--dim);opacity:.85;vertical-align:middle;font-weight:400;white-space:nowrap}
/* hover 时才略亮（给"细看"用） */
td:hover .refined{opacity:1;color:var(--fg)}
.mfwrap{position:relative;display:inline-flex;min-width:0}
.mfsum{display:inline-flex;align-items:center;gap:4px;min-width:0;max-width:200px;border:1px solid var(--line);background:var(--panel);color:var(--dim);font:inherit;font-size:13px;line-height:20px;padding:6px 10px;border-radius:8px;cursor:pointer}
.mfsum:hover{border-color:var(--acc)}
/* 有选中值 ⇒ 描边高亮（一眼看出这个维度筛过） */
.mfwrap.mfopen .mfsum,.mfsum--on{border-color:var(--acc);color:var(--fg)}
.mflab{flex:none;color:var(--dim)}
.mfval{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mfcar{flex:none;font-size:12px;opacity:.7}
/* 弹层：绝对定位 + 最大高度 + 内部滚动（标签有 1340 个值） */
.mflist{display:none;position:absolute;top:calc(100% + 4px);left:0;z-index:30;width:max(200px,100%);max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel);box-shadow:0 8px 24px rgba(0,0,0,.28);padding:4px}
.mfwrap.mfopen .mflist{display:block}
.mfopt{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:13px;line-height:18px;color:var(--dim)}
.mfopt:hover{background:var(--panel2);color:var(--fg)}
.mfopt--on{color:var(--fg);font-weight:600}
.mfck{flex:none;width:14px;height:14px;margin:0;accent-color:var(--acc);cursor:pointer}
.mfname{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mfct{flex:none;color:var(--dim);font-variant-numeric:tabular-nums;font-size:12px}
.mfempty{padding:6px 8px;color:var(--dim);font-size:12px}
.mfclear{display:block;width:100%;margin-top:4px;border:0;border-top:1px solid var(--line);background:transparent;color:var(--dim);font:inherit;font-size:12px;line-height:20px;padding:6px;cursor:pointer;text-align:center;border-radius:0 0 6px 6px}
.mfclear:hover{color:var(--acc);background:var(--panel2)}

/* 项目标签（2026-10-20）——「项目也作为标签的一种，强绑定，最优先显示」
   ⚠️ 视觉必须与普通标签**明显不同**，否则用户不知道它是"唯一的、绑定的"：
      · 实心描边 + 加粗（比普通标签重）
      · 📁 前缀（一眼认出是项目）
      · 用 accent 色（与"可选标签"的灰/彩色区分开）
   ⚠️ 它**不可多选**（一条记录只有一个项目），但点击仍然有效（按项目筛）。 */
.tagproj{cursor:pointer;font:inherit;display:inline-flex;align-items:center;gap:4px;
  border:1px solid var(--acc);border-radius:999px;padding:1px 9px;line-height:16px;
  background:color-mix(in srgb, var(--acc) 14%, transparent);
  color:var(--acc);font-weight:600;font-size:12px;white-space:nowrap;transition:.12s}
.tagproj:hover{background:color-mix(in srgb, var(--acc) 24%, transparent)}
.tagproj:active{transform:scale(.97)}
.tagproj:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
/* 列表里的项目标签压小一点（与 listtags 里的普通标签同尺寸） */
.listtags .tagproj{font-size:11px;line-height:15px;padding:0 6px}
.tagclick{cursor:pointer;font:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:999px;color:var(--fg);padding:1px 9px;line-height:16px;transition:.12s}
.tagclick:hover{border-color:var(--acc);color:var(--acc)}
.tagclick:active{transform:scale(.97)}
.tagclick:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.tagfree.tagclick{background:transparent;border-color:transparent;padding:1px 4px}
.tagfree.tagclick:hover{border-color:var(--acc)}
.tagchip.c-neutral{border-color:var(--line);color:var(--dim)}
.tagchip.c-blue{border-color:#3b82f6;color:#60a5fa}
.tagchip.c-sky{border-color:#0ea5e9;color:#38bdf8}
.tagchip.c-green{border-color:#22c55e;color:#4ade80}
.tagchip.c-amber{border-color:#f59e0b;color:#fbbf24}
.tagchip.c-orange{border-color:#f97316;color:#fb923c}
.tagchip.c-red{border-color:#ef4444;color:#f87171}
.tagchip.c-violet{border-color:#8b5cf6;color:#a78bfa}
/* ── 缩略图格（2026-10-14 从主面板的 Thumb 搬来）────────────────────────
   ⚠️ 两级回退：`/files/thumb` → 官方 `api/file` → **类型图标**（不许留破图）。
      所以格子里同时放 img 与 icon，谁失败谁让位（见 thumbError）。 */
.thumbcell{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;overflow:hidden;border-radius:6px;background:var(--panel2)}
.thumbcell img{width:100%;height:100%;object-fit:cover;display:block}
.thumbcell .ico{font-size:20px;line-height:1}
/* ── 密度 / 卡片尺寸（2026-10-14 从主面板的 ViewControl 搬来）────────────

<script>
const API = '/ext/artifacts'
let state = { view: 'card', trash: false, items: [], allItems: [], categories: { projects: [], types: [], tags: [] }, stats: null, selected: new Set(), refIndex: {}, page: 1, pageSize: 60,
  // ⭐ 2026-10-14 新增（档 1d）：文件浏览 / 文件搜索 / 会话改动
  //    这三块原来是**主面板**的能力，面板删了 ⇒ 搬到网页版（依琪：「允许你做成网页版本展示全部内容」）
  files: { dir: '', entries: [], total: 0, truncated: false, error: '', loading: false },
  fileQuery: '', fileResults: null, fileSearching: false, fileChip: '',
  changes: { status: 'idle', items: [], derived: false, sessionId: '', error: '' } }

const $ = (id) => document.getElementById(id)
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
const fmtSize = (b) => b > 1048576 ? (b/1048576).toFixed(1)+' MB' : b > 1024 ? (b/1024).toFixed(0)+' KB' : b+' B'
const fmtDate = (ts) => ts ? new Date(ts*1000).toLocaleString('zh-CN', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—'

/**
 * 带**超时**的请求。
 *
 * ⚠️ 2026-10-14 补：原来没有超时 —— 宿主没响应时界面会**永远**停在骨架屏上，
 *    用户看不出「在加载」和「已经死了」的区别。
 *    （这条是 `ui-spec` §12 的判据咬出来的：它原来守客户端的 `apiGet`/`apiSend`，
 *      `apiSend` 随主面板删掉后我把判据改到网页版 —— 结果它当场报网页版没有超时。）
 *
 * ⚠️ 超时与**普通失败**必须**分开报**：两者下一步动作不同
 *    （超时 ⇒ 重试；普通失败 ⇒ 看错误内容）。所以超时抛的文案里带「超时」。
 */
const API_TIMEOUT_MS = 15000
async function api(url, opts = {}) {
  const ctl = new AbortController()
  const timer = setTimeout(() => ctl.abort(), opts.timeoutMs || API_TIMEOUT_MS)
  try {
    const r = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts, signal: ctl.signal })
    if (!r.ok) {
      const j = await r.json().catch(() => ({}))
      // ⚠️ 宿主的理由原样带出来（403 out-of-scope 的文案在这里）
      throw new Error(j.error || j.hint || ('HTTP ' + r.status))
    }
    return await r.json()
  } catch (e) {
    if (e && e.name === 'AbortError') {
      throw new Error('请求超时（' + Math.round((opts.timeoutMs || API_TIMEOUT_MS) / 1000) + ' 秒无响应）—— 宿主可能没起来，点重试', { cause: e })
    }
    throw e
  } finally {
    clearTimeout(timer)
  }
}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200) }

/* ══════════════════════════════════════════════════════════════════════════
 * 多选筛选（2026-10-19 第 4 步）
 * ══════════════════════════════════════════════════════════════════════════
 * 依琪：「同样是下拉式展开多选择分类」
 *
 * ⚠️ 宿主 store.list() 是**单值相等**签名（没有 kind[]）⇒ 多选只能前端做：
 *    拉一次全量，本地过滤。与侧栏同一套语义：
 *      · 维度内 = OR（选了「产出+资料」= 两者都要）
 *      · 维度间 = AND
 *      · 空数组 = 不筛（不是"筛不出东西"）
 *
 * ⚠️ 搜索 q **仍然走服务端**（要搜 contentIndex 正文，本地搜会漏）。
 */
const MF = {
  kind: { label: '类别', picked: [] },
  artifact_type: { label: '类型', picked: [] },
  project: { label: '项目', picked: [] },
  tag: { label: '标签', picked: [] },
}

/** 已选总数（"N 项"文案）。 */
function mfCount() {
  let n = 0
  for (const k of Object.keys(MF)) n += MF[k].picked.length
  return n
}

/** 一条记录是否通过多选筛选。⚠️ 空 = 不筛，写法与侧栏 rpMatchPicks 同口径。 */
function mfMatch(r) {
  if (MF.kind.picked.length && MF.kind.picked.indexOf(r.kind) < 0) return false
  if (MF.artifact_type.picked.length && MF.artifact_type.picked.indexOf(r.artifact_type) < 0) return false
  if (MF.project.picked.length) {
    const p = String(r.project || '')
    if (MF.project.picked.indexOf(p) < 0) return false
  }
  if (MF.tag.picked.length) {
    const tags = Array.isArray(r.tags) ? r.tags : []
    let hit = false
    for (const t of MF.tag.picked) { if (tags.indexOf(t) >= 0) { hit = true; break } }
    // ⚠️ 标签是**多值字段**：选 a+b 表示"带 a **或** 带 b"，不是"同时有"
    if (!hit) return false
  }
  return true
}

/**
 * 从全量记录里算某个维度的可选值（带计数）。
 * ⚠️ 计数基于**全量**（state.allItems），不是筛后结果 ——
 *    否则选了之后别的值计数会跳，看起来像数据在变。
 */
/**
 * 机器值 → 人话（2026-10-19 真机修：下拉里显示的是 `deliverable`，用户看不懂）。
 * ⚠️ 只翻译**有确定中文**的维度；项目/标签是自由文本，原样显示。
 */
function mfLabelOf(key, value) {
  if (key === 'kind') {
    return { deliverable: '产出', reference: '资料' }[value] || value
  }
  if (key === 'artifact_type') {
    // 分类 id → 中文名。⚠️ 分类表可能还没拉到 ⇒ 原样回退（不显示空白）
    const cats = state.categories && Array.isArray(state.categories.types) ? state.categories.types : []
    return cats.indexOf(value) >= 0 ? value : value
  }
  return value
}

function mfOptions(key) {
  const count = {}
  const list = state.allItems || []
  for (const r of list) {
    if (key === 'tag') {
      const tags = Array.isArray(r.tags) ? r.tags : []
      for (const t of tags) { const k = String(t); count[k] = (count[k] || 0) + 1 }
    } else {
      const v = String(r[key] === undefined || r[key] === null ? '' : r[key])
      if (!v) continue   // 空值不进选项（'未分类'要单给，不能混进真值）
      count[v] = (count[v] || 0) + 1
    }
  }
  return Object.entries(count)
    .map(([value, n]) => ({ value, count: n }))
    .sort((a, b) => (b.count - a.count) || (a.value < b.value ? -1 : a.value > b.value ? 1 : 0))
}

/** 切换一个值（返回时**新数组**，不改原引用）。 */
function mfToggle(key, value) {
  const arr = MF[key].picked
  const at = arr.indexOf(value)
  if (at >= 0) arr.splice(at, 1)
  else arr.push(value)
}

/** 渲染一个多选下拉。 */
function mfRender(key) {
  const box = $('mf' + key.charAt(0).toUpperCase() + key.slice(1).replace('artifact_type', 'Type'))
  const host = $('mf' + ({ kind: 'Kind', artifact_type: 'Type', project: 'Project', tag: 'Tag' })[key])
  if (!host) return
  const picked = MF[key].picked
  const summary = !picked.length ? '全部'
    : picked.length <= 2 ? picked.map((v) => mfLabelOf(key, v)).join('、')
    : picked.slice(0, 2).map((v) => mfLabelOf(key, v)).join('、') + ' +' + (picked.length - 2)
  const opts = mfOptions(key)
  host.innerHTML =
    `<button type="button" class="mfsum${picked.length ? ' mfsum--on' : ''}" data-k="${key}" aria-expanded="false">` +
      `<span class="mflab">${esc(MF[key].label)}</span><span class="mfval">${esc(summary)}</span><span class="mfcar">▾</span>` +
    '</button>' +
    '<div class="mflist">' +
      (opts.length ? opts.map((o) =>
        `<label class="mfopt${picked.indexOf(o.value) >= 0 ? ' mfopt--on' : ''}">` +
        `<input type="checkbox" class="mfck" data-k="${key}" value="${esc(o.value)}"${picked.indexOf(o.value) >= 0 ? ' checked' : ''}>` +
        `<span class="mfname">${esc(mfLabelOf(key, o.value))}</span><span class="mfct">${o.count}</span></label>`
      ).join('') : '<div class="mfempty">没有可选项</div>') +
      (picked.length ? `<button type="button" class="mfclear" data-k="${key}">清空「${esc(MF[key].label)}」</button>` : '') +
    '</div>'
}

/** 渲染全部 4 个。 */
function mfRenderAll() { for (const k of Object.keys(MF)) mfRender(k) }

/* 多选下拉的交互（**事件委托**：4 个下拉走一处，不绑 4 套）。
 * ⚠️ 同时只允许展开一个 —— 两个叠着会互相遮。
 * ⚠️ 点外 / Esc 关闭要自己补（不是原生 <details>，浏览器不会自动收）。 */
document.addEventListener('click', (e) => {
  const t = e.target
  if (!t || !t.closest) return
  const hostOf = (k) => document.getElementById('mf' + ({ kind: 'Kind', artifact_type: 'Type', project: 'Project', tag: 'Tag' })[k])
  const sum = t.closest(".mfsum")
  if (sum) {
    const host = sum.parentElement
    const wasOpen = host.classList.contains("mfopen")
    document.querySelectorAll(".mfwrap.mfopen").forEach((x) => x.classList.remove("mfopen"))
    if (!wasOpen) host.classList.add("mfopen")
    return
  }
  const ck = t.closest(".mfck")
  if (ck) {
    mfToggle(ck.dataset.k, ck.value)
    mfRender(ck.dataset.k)
    // ⚠️ 选完**不自动收**（多选时自动收会让人反复点开）
    const h = hostOf(ck.dataset.k); if (h) h.classList.add("mfopen")
    reload()
    return
  }
  const clr = t.closest(".mfclear")
  if (clr) {
    MF[clr.dataset.k].picked.length = 0
    mfRender(clr.dataset.k)
    const h2 = hostOf(clr.dataset.k); if (h2) h2.classList.add("mfopen")
    reload()
    return
  }
  if (!t.closest(".mfwrap")) document.querySelectorAll(".mfwrap.mfopen").forEach((x) => x.classList.remove("mfopen"))
})
document.addEventListener('keydown', (e) => {
  if (e.key === "Escape") document.querySelectorAll(".mfwrap.mfopen").forEach((x) => x.classList.remove("mfopen"))
})

/**
 * 「只看未精炼」开关（2026-10-19）。
 * ⚠️ 映射到服务端 `refine=1`（宿主认这个参数）—— 不改契约。
 * ⚠️ 按钮的 `aria-pressed` 必须跟上：读屏靠它知道开关状态。
 */
function toggleUnrefined() {
  const el = $('fRefine')
  const btn = $('btnUnrefined')
  const on = el.value !== '1'
  el.value = on ? '1' : ''
  if (btn) {
    btn.classList.toggle('on', on)
    btn.setAttribute('aria-pressed', on ? 'true' : 'false')
  }
  reload()
}

/** 把开关的视觉/ARIA 与 `fRefine` 的值对齐（清筛选后要调）。 */
function syncUnrefinedBtn() {
  const el = $('fRefine')
  const btn = $('btnUnrefined')
  if (!el || !btn) return
  const on = el.value === '1'
  btn.classList.toggle('on', on)
  btn.setAttribute('aria-pressed', on ? 'true' : 'false')
}

async function reload() {
  state.loading = true
  state.loadError = ''
  render() // ⚠️ 先画骨架屏（ui-spec §11.5）；加载完在 finally 里撤掉
  try {
    const p = new URLSearchParams({ sort: $('fSort').value })
    if (state.trash) p.set('status', 'trashed')
    // ⚠️ 搜索 **仍走服务端**：它要搜 contentIndex（正文），而列表响应里的正文
    //    可能被截断 ⇒ 本地搜会漏。这是唯一不能下放本地的维度。
    const q = $('q').value.trim(); if (q) p.set('q', q)
    const rf = $('fRefine').value; if (rf) p.set('refine', rf)
    // ⚠️ 多选维度**不拼进 URL**（宿主单值相等，拼不了多个）——
    //    拉全量之后在本地用 mfMatch 过滤。见 MF 那段注释。
    state.allItems = await api(API + '?' + p)
    state.items = state.allItems.filter(mfMatch)
    mfRenderAll()
    renderFilterChips()
    state.page = 1
  } catch (e) {
    // ⚠️ 失败**不能**只改 DOM 就完事：`state.items` 也得清掉，
    //    否则下次 render() 会把**旧数据**画出来，看起来像"加载成功了"。
    state.items = []
    state.loadError = e && e.message ? e.message : String(e)
  } finally {
    state.loading = false
    render()
  }
}
const debouncedReload = (() => { let t; return () => { clearTimeout(t); t = setTimeout(reload, 300) } })()

// id → 标题 索引（用于显示"引用了哪些资料"）
async function refreshRefIndex() {
  try { const all = await api(API + '?limit=5000'); state.refIndex = {}; for (const r of all) state.refIndex[r.id] = r.title } catch { /* 忽略 */ }
}
function refNames(ids) { return (ids || []).map((id) => state.refIndex[id] || id).filter(Boolean) }

async function loadMeta() {
  const [cats, stats] = await Promise.all([api(API + '/categories'), api(API + '/stats')])
  state.categories = cats; state.stats = stats
  // ⚠️ 2026-10-19 第 4 步：fProject / fType / fTag 已从 <select> 改成多选组件
  //    （id 变成 mfProject / mfType / mfTag）⇒ **不能再给它们写 innerHTML**，
  //    否则空指针（真机报 `Cannot set properties of null`）。
  //    多选的选项由 mfRender 从 state.allItems 自己算（带计数），不需要这里灌。
  //    ⇒ 这里只保留 **分类表** 的拉取（别处还要用 cats）。
  $('stats').innerHTML =

// 撤销式 toast：消息 + [撤销] 按钮，几秒后消失
let undoHandle = null
function undoToast(msg, undoFn) {
  const t = $('toast')
  t.innerHTML = `${esc(msg)} <button class="primary" style="margin-left:10px;padding:3px 10px" onclick="(async()=>{try{await undoFn();toast('✅ 已撤销')}catch(e){toast('❌ 撤销失败：'+e.message)}finally{clearTimeout(undoHandle)}})()">撤销</button>`
  t.classList.add('show')
  clearTimeout(undoHandle)
  undoHandle = setTimeout(() => t.classList.remove('show'), 6000)
}
function setView(v) { state.view = v; syncViewButtons(); render() }
/** 视图按钮的选中态（单独一个函数：偏好按钮也共用这套视觉）。 */
function syncViewButtons() {
  document.querySelectorAll('.view-switch button[data-v]').forEach((b) => b.classList.toggle('active', b.dataset.v === state.view))
}
/** 密度 / 卡片尺寸按钮的选中态。 */
function syncPrefButtons() {
  const d = uiPrefs.density === 'compact' ? 'denCompact' : 'denCozy'
  const c = { s: 'cardS', m: 'cardM', l: 'cardL' }[uiPrefs.card]
  for (const [id, on] of [['denCozy', d === 'denCozy'], ['denCompact', d === 'denCompact'], ['cardS', c === 'cardS'], ['cardM', c === 'cardM'], ['cardL', c === 'cardL']]) {
    const el = $(id)
    if (el) el.classList.toggle('active', on)
  }
}
function toggleTrash() { state.trash = !state.trash; $('trashBar').style.display = state.trash ? 'flex' : 'none'; $('trashBtn').classList.toggle('primary', state.trash); reload() }
async function emptyTrash() { if (!confirm('永久删除回收站内全部产物？')) return; const ids = state.items.map((r) => r.id); for (const id of ids) await api(API + '/' + id, { method: 'DELETE' }); toast('回收站已清空'); reload() }

function starsHtml(r) {
  let h = '<span class="stars" title="点击打分">'
  for (let i = 1; i <= 5; i++) h += `<span onclick="event.stopPropagation();setStars('${r.id}',${i})">${i <= r.stars ? '★' : '☆'}</span>`
  return h + '</span>'
}
async function setStars(id, n) { await api(API + '/' + id, { method: 'PATCH', body: JSON.stringify({ stars: n }) }); toast(`★ ${n}`); reload() }

function typeIcon(t) { return { image: '🖼️', audio: '🎵', video: '🎬', document: '📄', code: '💻', archive: '📦' }[t] || '📎' }

function previewHtml(r) {
  if (!r.exists) return '<span class="ico" title="文件缺失">🚫</span>'
  if (r.mime_type.startsWith('image/')) return `<img src="${API}/${r.id}/file" alt="" loading="lazy">`
  return `<span class="ico">${typeIcon(r.artifact_type)}</span>`
}

/* ── 标签芯片（2026-10-14 从主面板的 DetailDrawer 搬来）────────────────────
 * 受管标签表（`GET /managed-tags`）里有样式的标签 ⇒ 带颜色/字重的芯片；
 * 其余是素文本。**受管 ≠ 有样式**（受管但没配样式的照样是芯片，只是素净）。
 *
 * ⚠️ 三态**不许拍平**：
 *   · `managedTags === null`（还没拉到 / 拉失败）⇒ **不猜**，一律素文本，且**不报错**
 *     （网页版是独立页面，标签没样式不影响用；把"读不到"渲染成红字是过度反应）
 *   · `[]`（拉到了但表是空的）⇒ 也素文本，语义上不同但**渲染上一样**（都是没样式）
 *   ⇒ 这里**只影响观感**，所以两态可以同形；但**代码上必须分开取**，
 *     否则哪天要在界面上区分时会发现信息已经丢了。
 */
let managedTags = null
async function loadManagedTags() {
  try {
    const r = await api(API + '/managed-tags')
    managedTags = (r && r.ok === true && Array.isArray(r.tags)) ? r.tags : null
  } catch { managedTags = null }
  // ⚠️ 必须**重渲染一次**：首次 `reload()` 与它是并行的，那时 `managedTags` 还是 `null`
  //    ⇒ 全部标签都渲染成素文本，而且**之后没有任何东西会触发重渲染**。
  //    （2026-10-14 真机踩到：TAGCHIPS=0 / TAGFREE=273 —— 数据是对的，只是没重画。）
  render()
}

/** 归一化标签名（与规则层同口径：小写 + 去掉装饰性分隔符）。 */
function normTag(t) {
  return String(t || '').toLowerCase().replace(/[\s\u00b7\u30fb\u2027\u2219\u22c5\u2010\u2011\u2012\u2013\u2014\u2015\-_]+/gu, '')
}

/**
 * 把「项目」并进标签列表的**第一个**（2026-10-20 · 依琪：项目作为一种标签，强绑定，最优先）。
 *
 * ⚠️ 只在**渲染层**合并 —— `project` 字段与 `tags` 数组都不动：
 *    `project` 有 41 处业务在用（筛选/语义搜索/精炼/项目合并/概览），
 *    把它塞进 `tags` 会让"哪些标签是项目"不可判定，所有 `r.project === x` 全要改写。
 *
 * ⚠️ 去重：项目名**可能恰好也是标签**（例：项目「三角洲口琴工作台」+ 同名标签）。
 *    不去重的话同一个词会出现两次，一个带📁一个不带 —— 看起来像 bug。
 *
 * @param {object} r 记录
 * @returns {{items: Array<{name:string, isProject:boolean}>, rest: Array<string>}}
 */
function mergeProjectTag(r) {
  const proj = String(r && r.project ? r.project : '')
  const tags = Array.isArray(r && r.tags) ? r.tags : []
  if (!proj) return { items: [], rest: tags }
  // ⚠️ 用**归一化**比较（与 normTag 同口径）—— 项目名与标签只差大小写/分隔符时也算重复
  const pk = normTag(proj)
  const rest = tags.filter((t) => normTag(t) !== pk)
  return { items: [{ name: proj, isProject: true }], rest: rest }
}

/**
 * 渲染标签（含**最优先的项目标签**）。
 *
 * @param {object} r 记录（要 `project` + `tags`）
 * @param {object} [opts] { compact?: boolean }
 */
function tagChipsHtmlForRecord(r, opts) {
  const o = opts || {}
  const merged = mergeProjectTag(r)
  const table = Array.isArray(managedTags) ? managedTags : []
  const byKey = new Map(table.map((m) => [normTag(m.tag), m]))
  const out = []

  // ① 项目标签（最优先，视觉上不同，点它筛**项目**不是标签）
  for (const it of merged.items) {
    out.push('<button type="button" class="tagproj tagclick"'
      + ' data-proj="' + esc(it.name) + '"'
      + ' onclick="event.stopPropagation();filterByProject(this.dataset.proj)"'
      + ' title="按项目「' + esc(it.name) + '」筛选（项目是强绑定的，一条记录只属于一个项目）">'
      + '📁 ' + esc(it.name) + '</button>')
  }

  // ② 普通标签
  for (const t of merged.rest) {
    const m = byKey.get(normTag(t))
    const click = ' onclick="event.stopPropagation();filterByTag(this.dataset.tag)"'
    const data = ' data-tag="' + esc(t) + '"'
    if (!m) {
      out.push('<button type="button" class="tagfree tagclick"' + data + click
        + ' title="按标签「' + esc(t) + '」筛选">' + esc(t) + '</button>')
      continue
    }
    const cls = 'tagchip tagclick' + (m.color ? ' c-' + esc(m.color) : '') + (m.weight === 'bold' ? ' bold' : '')
    out.push('<button type="button" class="' + cls + '"' + data + click
      + ' title="按标签「' + esc(m.tag) + '」筛选">' + esc(t) + '</button>')
  }

  if (!out.length) return ''
  return '<div class="tagchips">' + out.join('') + '</div>'
}

function tagChipsHtml(tags) {
  if (!tags || !tags.length) return ''
  const table = Array.isArray(managedTags) ? managedTags : []
  const byKey = new Map(table.map((m) => [normTag(m.tag), m]))
  return '<div class="tagchips">' + tags.map((t) => {
    const m = byKey.get(normTag(t))
    // ⚠️ **受管与自由词都要能点** —— 用户看到两个长得不一样的标签，
    //    如果只有一个能点，那就是在教他"有的标签能用有的不能用"（假规律）。
    // ⚠️ 用 `<button>` 不用 `<span onclick>`：键盘可达、读屏认得出这是可操作元素。
    // ⚠️ `onclick` 里必须 `event.stopPropagation()`：
    //    标签在卡片/行内部，而整张卡片是可点的（点它会打开详情）——
    //    不拦住的话「点标签」会变成「打开详情」，看起来像点错了。
    const click = ` onclick="event.stopPropagation();filterByTag(this.dataset.tag)"`
    // `data-tag` 存**原始标签名**（不是归一化的）—— 服务端按原名精确匹配
    const data = ` data-tag="${esc(t)}"`
    if (!m) {
      return `<button type="button" class="tagfree tagclick"${data}${click} title="按标签「${esc(t)}」筛选">${esc(t)}</button>`
    }
    // 颜色/字重**只来自规则层**（不在这里自己判一遍）
    const cls = 'tagchip tagclick' + (m.color ? ' c-' + esc(m.color) : '') + (m.weight === 'bold' ? ' bold' : '')
    return `<button type="button" class="${cls}"${data}${click} title="按标签「${esc(m.tag)}」筛选">${esc(t)}</button>`
  }).join('') + '</div>'
}

/**
 * 点标签 ⇒ 按该标签筛选。
 *
 * ⚠️ 复用 `fTag` 而不是新造一套筛选状态：
 *    新造就会有两份"当前筛选"（下拉里一份、state 里一份），迟早不一致。
 * ⚠️ 切到 list 视图 + 滚回顶部：
 *    在卡片视图里点完看不到"只剩这些"的效果（卡片区要往下滚才知道少了几张）。
 * ⚠️ 标签不在下拉选项里时（比如新增的标签、下拉还没刷新）**也要能筛**：
 *    `fTag.value = tag` 对不存在的 option 会静默失败（value 变空）⇒ 会筛成"全部"。
 *    ⇒ 先查有没有这个 option，没有就**临时补一个**（否则用户点了没反应，还会以为库坏了）。
 */
  
  /**
   * 渲染「当前筛选痕迹」条（2026-10-19）。
   *
   * ⚠️ 数据**只从 DOM 的 select 读**，不另存 state —— 否则会出现"两份当前筛选"，
   *    迟早不一致（今晚已经在受管标签上栽过一次同类问题）。
   * ⚠️ 没有筛选时**整条隐藏**（`display:none`），不占位置。
   */
  function renderFilterChips() {
    const bar = $('filterBar')
    if (!bar) return
    // ⚠️ 2026-10-19 第 4 步：4 个多选维度改从 `MF` 读（fTag 等已不是 <select>）。
    //    `refine` 仍是单选（select），照旧读 DOM。
    const active = []
    const MF_LABEL = { kind: '类别', artifact_type: '类型', project: '项目', tag: '标签' }
    for (const k of Object.keys(MF_LABEL)) {
      for (const v of MF[k].picked) {
        active.push({ id: 'mf:' + k, label: MF_LABEL[k], text: mfLabelOf(k, v), value: v })
      }
    }
    // ⚠️ 2026-10-19：「状态」已从三值下拉改成**开关**（fRefine 变成 hidden input）。
    //    ⇒ 不能再用 `rfSel.options[...]`（hidden input 没有 options）——
    //       真机就是这么崩的：`Cannot read properties of undefined`。
    const refineOn = $('fRefine') && $('fRefine').value === '1'
    if (refineOn) {
      active.push({ id: 'fRefine', label: '状态', text: '只看未精炼', value: '1' })
    }
    const q = $('q').value.trim()
    if (q) active.push({ id: 'q', label: '搜索', text: q, value: q })
    if (!active.length) { bar.style.display = 'none'; bar.innerHTML = ''; return }
    bar.style.display = 'flex'
    bar.innerHTML = active.map((a) =>
      `<span class="fchip"><span class="fchiplab">${esc(a.label)}</span>` +
      `<span class="fchiptxt">${esc(a.text)}</span>` +
      `<button type="button" class="fchipx" title="取消这个筛选" aria-label="取消 ${esc(a.label)} 筛选" onclick="clearOneFilter('${esc(a.id)}')">✕</button></span>`
    ).join('') +
      (active.length > 1 ? `<button type="button" class="fchipall" onclick="clearAllFilters()">全部清除</button>` : '')
  }
  
  /** 取消某一个筛选。⚠️ 只清它，别的不动。 */
  function clearOneFilter(id) {
    // ⚠️ 2026-10-19 第 4 步：筛选痕迹条现在会给出 `mf:kind` 这种 id
    //    （多选维度）和 `fRefine`（仍是单选）。两种形态都要处理。
    if (id === 'q') {
      $('q').value = ''
    } else if (id.indexOf('mf:') === 0) {
      const k = id.slice(3)
      if (MF[k]) { MF[k].picked.length = 0; mfRender(k) }
    } else {
      const sel = $(id)
      // ⚠️ 2026-10-19：`fRefine` 现在是 hidden input（开关），清它之后
      //    必须同步按钮的视觉/ARIA，否则按钮看着还"开着"。
      if (sel) sel.value = ''
      if (id === 'fRefine') syncUnrefinedBtn()
    }
    reload()
  }
  
  /** 清空全部筛选（含搜索）。 */
  function clearAllFilters() {
    for (const k of Object.keys(MF)) { MF[k].picked.length = 0; mfRender(k) }
    const rf = $('fRefine')
    if (rf) rf.value = ''
    syncUnrefinedBtn()
    $('q').value = ''
    reload()
  }
  
/**
 * 点**项目**标签 ⇒ 按项目筛选（2026-10-20）。
 *
 * ⚠️ 与 `filterByTag` 是**两条路**，不能复用：
 *    项目筛的是 `project=` 参数，标签筛的是 `tag=`。
 *    如果点项目却走标签筛选，**搜不到东西**（项目名不一定是标签）。
 * ⚠️ 项目是**强绑定单选**（一条记录只有一个项目）⇒ 直接覆盖，不是 toggle 追加。
 *    再点同一个 = 取消（保持与标签一致的交互手感）。
 */
function filterByProject(name) {
  const p = String(name || '')
  if (!p) return
  const cur = MF.project.picked
  const same = cur.length === 1 && cur[0] === p
  MF.project.picked.length = 0
  if (!same) MF.project.picked.push(p)
  mfRender('project')
  if (state.view !== 'list') state.view = 'list'
  syncViewButtons()
  reload()
  try { window.scrollTo({ top: 0, behavior: 'smooth' }) } catch { /* 忽略 */ }
}

function filterByTag(tag) {
  const name = String(tag || '')
  if (!name) return
  // ⚠️ 2026-10-19 第 4 步：fTag 从 <select> 改成了多选组件 ⇒ 不能再设 .value。
  //    改成直接写 MF.tag.picked（**唯一真相源**）。
  //    ⚠️ 点同一个标签 = 取消选中（与侧栏 rpTogglePick 同语义）。
  MF.tag.picked.length = 0
  MF.tag.picked.push(name)
  // ⚠️ **始终切到列表视图**（2026-10-19 真机修）：
  //    第一版我写的是 `if (state.view !== 'list' && state.view !== 'card')` ——
  //    等于把 card 排除在外，而**默认视图就是 card** ⇒ 这个"切列表"从来没生效过。
  //    为什么会写错：我想的是"列表和卡片都能看"，但卡片视图下**看不出条数变少了**
  //    （卡片铺满整屏，筛完只剩 1 张也铺满第一行）⇒ 必须切列表才看得出效果。
  if (state.view !== 'list') state.view = 'list'
  syncViewButtons()
  reload()
  // 滚回顶部：筛选后还停在旧位置会让人以为"没变"
  try { window.scrollTo({ top: 0, behavior: 'smooth' }) } catch { /* 忽略 */ }
}

  /* ══════════════════════════════════════════════════════════════════════
   * 列表列宽 + 行高（2026-10-19 第 3 步 · 依琪「都使用分割线来自由控制」）
   * ══════════════════════════════════════════════════════════════════════
   * ⚠️ 列模型**照抄侧栏**：每列固定 px，**尾部多一个空列吃剩余空间**。
   *    侧栏曾栽过一次：名字列用 `1fr` 时，拖任何一列都只有它在动
   *    （因为多/少出来的空间全给了那个 1fr）。
   * ⚠️ 行高用 CSS 变量 `--row-h`，拖表头下那根横向分隔线改它；
   *    缩略图 `height: calc(var(--row-h) - 12px)` —— 一行高度变了图也跟着变。
   */
  const COLS = [
    // key / 表头 / 默认 px / 最小 px
    { key: 'ico', label: '', w: 64, min: 48 },
    { key: 'name', label: '产物', w: 340, min: 160 },
    // ⚠️ 2026-10-20：项目不再是独立列 —— 它已经是**标签列里的第一个**
    //    （依琪：「项目也作为标签的一种，强绑定，最优先显示」）。
    //    保留独立列 = 同一信息显示两次（截图里左边「本地生图环境」+ 右边「📁 本地生图环境」）。
    //    ⇒ 删掉这一列，把宽度并给标签（标签现在要放项目 + 标签）。
    { key: 'tags', label: '标签', w: 330, min: 120 },
    { key: 'stars', label: '星级', w: 92, min: 60 },
    { key: 'size', label: '大小', w: 76, min: 50 },
    { key: 'date', label: '登记时间', w: 96, min: 70 },
    { key: 'session', label: '来源会话', w: 110, min: 60 },
    { key: 'ops', label: '操作', w: 180, min: 120 },
  ]
  
  /** 列宽/行高持久化键。 */
  const COLS_KEY = 'alf-page-cols'
  const ROWH_KEY = 'alf-page-rowh'
  const ROW_H_DEFAULT = 56
  const ROW_H_MIN = 32
  const ROW_H_MAX = 240
  
  /** 读列宽。⚠️ 畸形/过小一律落回默认（存了个 0 会让列消失）。 */
  function loadCols() {
    const out = {}
    for (const c of COLS) out[c.key] = c.w
    try {
      const raw = localStorage.getItem(COLS_KEY)
      if (!raw) return out
      const saved = JSON.parse(raw)
      for (const c of COLS) {
        const v = Number(saved && saved[c.key])
        if (Number.isFinite(v) && v >= c.min) out[c.key] = v
      }
    } catch { /* 忽略：用默认 */ }
    return out
  }
  
  function saveCols(w) {
    try { localStorage.setItem(COLS_KEY, JSON.stringify(w)) } catch { /* 忽略 */ }
  }
  
  /** 读行高（夹到 [MIN, MAX]）。 */
  function loadRowH() {
    try {
      const v = Number(localStorage.getItem(ROWH_KEY))
      if (Number.isFinite(v) && v >= ROW_H_MIN && v <= ROW_H_MAX) return v
    } catch { /* 忽略 */ }
    return ROW_H_DEFAULT
  }
  
  /** 当前列宽 / 行高（模块级状态，拖动时频繁改，不走重渲）。 */
  let colW = loadCols()
  let rowH = loadRowH()
  
  /** 把列宽/行高落到 DOM 上（拖的时候只调这个，不重画整个表）。 */
  function applyCols() {
    const table = document.querySelector("#content table")
    if (!table) return
    for (const c of COLS) {
      const col = table.querySelector(`col[data-k="${c.key}"]`)
      if (col) col.style.width = colW[c.key] + "px"
    }
    table.style.setProperty("--row-h", rowH + "px")
  }
  
  /**
   * 开始拖一列的分隔线。
   * ⚠️ 用 **pointer 事件 + setPointerCapture**（与侧栏一致）：
   *    ① 触屏/手写笔能用；② 指针移出表格也不丢事件。
   * ⚠️ 夹到 min：不夹能拖成负宽 = 列消失。
   * ⚠️ 成对清理 pointerup / pointercancel（只在 up 清会留野监听）。
   */
  function startColDrag(event, col) {
    if (!event) return
    event.preventDefault()
    event.stopPropagation()
    const startX = Number(event.clientX) || 0
    const startW = colW[col.key]
    const grip = event.currentTarget
    try { if (grip.setPointerCapture) grip.setPointerCapture(event.pointerId) } catch { /* 老浏览器 */ }
    const prevCursor = document.body.style.cursor
    document.body.style.cursor = "col-resize"
    function onMove(e) {
      const dx = (Number(e.clientX) || 0) - startX
      colW[col.key] = Math.max(col.min, Math.round(startW + dx))
      applyCols()
    }
    function onUp() {
      document.body.style.cursor = prevCursor
      try { if (grip.releasePointerCapture) grip.releasePointerCapture(event.pointerId) } catch { /* 忽略 */ }
      document.removeEventListener("pointermove", onMove)
      document.removeEventListener("pointerup", onUp)
      document.removeEventListener("pointercancel", onUp)
      saveCols(colW)
    }
    document.addEventListener("pointermove", onMove)
    document.addEventListener("pointerup", onUp)
    document.addEventListener("pointercancel", onUp)
  }
  
  /** 开始拖行高（表头下方那根横向分隔线）。 */
  function startRowDrag(event) {
    if (!event) return
    event.preventDefault()
    const startY = Number(event.clientY) || 0
    const startH = rowH
    const grip = event.currentTarget
    try { if (grip.setPointerCapture) grip.setPointerCapture(event.pointerId) } catch { /* 忽略 */ }
    const prevCursor = document.body.style.cursor
    document.body.style.cursor = "row-resize"
    function onMove(e) {
      const dy = (Number(e.clientY) || 0) - startY
      rowH = Math.max(ROW_H_MIN, Math.min(ROW_H_MAX, Math.round(startH + dy)))
      applyCols()
    }
    function onUp() {
      document.body.style.cursor = prevCursor
      try { if (grip.releasePointerCapture) grip.releasePointerCapture(event.pointerId) } catch { /* 忽略 */ }
      document.removeEventListener("pointermove", onMove)
      document.removeEventListener("pointerup", onUp)
      document.removeEventListener("pointercancel", onUp)
      try { localStorage.setItem(ROWH_KEY, String(rowH)) } catch { /* 忽略 */ }
    }
    document.addEventListener("pointermove", onMove)
    document.addEventListener("pointerup", onUp)
    document.addEventListener("pointercancel", onUp)
  }
  
  /** 表头里的拖动把手（与侧栏同一视觉语言：一根线，可点区 10px）。 */
  function gripHtml(col, isLast) {
    if (isLast) return ''
    return `<span class="colgrip" role="separator" aria-orientation="vertical"` +
      ` aria-label="拖动调整「${esc(col.label || '图标')}」列宽"` +
      ` title="拖动调整列宽（双击恢复默认）"` +
      ` data-k="${col.key}"` +
      ` onpointerdown="startColDrag(event, COLS.find(c=>c.key===this.dataset.k))"` +
      ` ondblclick="resetColWidth(this.dataset.k)"` +
      ` onclick="event.stopPropagation()"></span>`
  }
  
  /** 双击恢复该列默认宽。 */
  function resetColWidth(key) {
    const c = COLS.find((x) => x.key === key)
    if (!c) return
    colW[key] = c.w
    applyCols()
    saveCols(colW)
  }
  
/**
 * 精炼状态标签（2026-10-19 · 依琪：「已处理打上**已经精炼标签**就可以」）。
 *
 * ⚠️ **已精炼的打标签，未精炼的留白** —— 这是依琪的原话，照做。
 *
 * ⚠️ 但必须承认一件事（我第一版在这里自欺）：
 *    实测 **424/448 是已精炼**，所以这个标签会出现**满屏**。
 *    我原来的注释写着"给多数打标签等于没有标签"，然后代码还是给多数打了
 *    —— 注释与代码相反，那注释就是**假的**（已按实际改掉这段说明）。
 *
 * ⇒ 解决办法不是"不标"（那是违背要求），而是**让它退到背景**：
 *    · `.refined` 用 muted 色 + 小字号（扫读时自动忽略、细看能找到）
 *    · 只在**列表视图**渲染（卡片视图有别的表达方式，不重复堆）
 *    · 与「只看未精炼」开关**互补**：开关是主动筛，标签是被动扫。
 */
function refineBadge(r) {
  if (r.needsRefine) return ''
  return '<span class="refined" title="AI 已精炼（摘要 / 标签 / 项目齐备）">✓ 已精炼</span>'
}

function listHtml(r) {
  return `<tr>
    <td class="pvico">${r.mime_type.startsWith('image/') && r.exists ? `<img class="mini-thumb" src="${API}/${r.id}/file" loading="lazy">` : `<span class="pvtype">${typeIcon(r.artifact_type)}</span>`}</td>
    <td><b>${esc(r.title)}</b>${refineBadge(r)}<br><span style="color:var(--dim);font-size:11px">${esc(r.path)}</span></td>
    <td class="listtags">${tagChipsHtmlForRecord(r)}</td>
    <td>${starsHtml(r)}</td>
    <td>${fmtSize(r.size_bytes)}</td>
    <td>${fmtDate(r.created_at)}</td>

    <td style="white-space:nowrap">
      <button onclick="openPreview('${r.id}')">预览</button>
      <button onclick="openEdit('${r.id}')">编辑</button>

        ? `<button onclick="restoreOne('${r.id}')">恢复</button><button class="danger" onclick="delOne('${r.id}')">删除</button>`
        : `<button class="danger" onclick="trashOne('${r.id}')">回收</button>`}

}

function render() {
  // ⚠️ 重画之后必须把列宽/行高再落一次：拖动改的是 colW 变量，
  //    而重画会用 colgroup 里**渲染时**的值 —— 两者要同步。
  //    用 requestAnimationFrame 是为了等 DOM 真的挂上去。
  requestAnimationFrame(applyCols)
  const c = $('content')

  // ⭐ 2026-10-14：文件 / 改动两个视图**不吃 state.items**（数据源不同）
  //    ⇒ 必须在「空库」那条兜底**之前**分流，否则空库时它们永远显示"库是空的"。
  if (state.view === 'files') { renderFiles(); return }
  if (state.view === 'changes') { renderChanges(); return }

  // ⚠️ 加载失败**单独一支**（不许和"库是空的"共用一句 —— 那是两件事）
  if (state.loadError) {
    c.innerHTML = `<div class="empty">❌ 加载失败：${esc(state.loadError)}<br><br>`
      + `<span class="hint">检查插件是否已安装并重启 dsh web。</span><br><br>`
      + `<button onclick="reload()">重试</button></div>`
    return
  }

  // ⚠️ 骨架屏：**只在真的在加载时**（ui-spec §11.5）。
  //    加载完（含失败）在 reload 的 finally 里撤掉 —— 不许留个假骨架骗人。
  if (state.loading) {
    c.innerHTML = state.view === 'list' ? skeletonHtml('rows') : skeletonHtml('cards')
    return
  }

  if (!state.items.length) {
    // ⚠️ 三态分开（ui-spec §六 的同一条教训）：
    //    回收站空 / **被筛选过滤成空** / 库真的空 —— 下一步动作各不相同。
    // ⚠️ 2026-10-19：fKind/fProject/fType/fTag 已不是 <select>（改成多选 MF）
    //    ⇒ 不能再读 .value（会 undefined 或空指针）。改成读 MF + refine 开关。
    const hasFilter = $('q').value || $('fRefine').value || mfCount() > 0
    if (state.trash) {
      c.innerHTML = `<div class="empty">🗑️ 回收站是空的。</div>`
    } else if (hasFilter) {
      // ⚠️ 必须说清是"**被筛掉了**"，并给一键清空 —— 否则用户会以为库空了
      c.innerHTML = `<div class="empty">🔍 当前筛选条件下没有结果。<br><br>`
        + `<span class="hint">库不是空的，是这几项筛选把结果筛掉了。</span><br><br>`
        + `<button onclick="clearFilters()">清空筛选看全部</button></div>`
    } else {
      c.innerHTML = `<div class="empty">✨ 库还是空的<br><br>点右上角「登记产物」手动登记，或让 Agent 调用 register_artifact；<br>也可以「📥 导入文件夹」把一批资料批量收进来</div>`
    }
    return
  }
  // 分页：每页 pageSize 条，末尾「加载更多」
  const visible = state.items.slice(0, state.page * state.pageSize)
  const more = state.items.length > visible.length
  const moreBtn = more ? `<div style="text-align:center;margin:18px 0"><button onclick="loadMore()" style="padding:8px 24px">加载更多（还剩 ${state.items.length - visible.length} 条）</button></div>` : `<div class="hint" style="text-align:center;margin:14px 0">共 ${state.items.length} 条</div>`
  if (state.view === 'list') {
    // ⚠️ `role="grid"` + `aria-rowcount`（ui-spec §三.3/§七）：读屏才知道这是表格、共几行。
    //    `aria-rowcount` 取**全量**（不是可见行数）—— 否则读屏读到的是残缺的。
    // ══ 列表表格（2026-10-19 第 3 步：可拖列宽 + 可拖行高）══════════════════
      // ⚠️ `<colgroup><col>` 定义列宽：一次定义整列，不用给每个 `<td>` 写 style
      //    （447 行 × 9 列 = 4023 个 style，改宽度还要全量重渲）。
      // ⚠️ 尾部多一个空列吃剩余空间 —— 与侧栏同一套列模型。
      const colgroup = '<colgroup>' +
        COLS.map((c) => '<col data-k="' + c.key + '" style="width:' + (colW[c.key] || c.w) + 'px">').join('') +
        '<col>' +
        '</colgroup>'
      const headCells = COLS.map((c, i) =>
        '<th class="pvth">' + esc(c.label) + gripHtml(c, i === COLS.length - 1) + '</th>').join('')
      c.innerHTML = '<table role="grid" class="pvtable" aria-rowcount="' + state.items.length + '" style="--row-h:' + rowH + 'px">'
        + colgroup
        + '<thead><tr>' + headCells + '</tr>'
        // ⚠️ 行高把手**放在表头里**（表头 sticky）：447 行时它始终可见。
        //    放在表格下方的话，用户要滚到最底才看得到 —— 与"看不见分割线"同一个错。
        + '<tr class="rowgripr"><th class="rowgripth" colspan="' + (COLS.length + 1) + '"'
        + ' title="拖动调整行高（缩略图会跟着变大）" onpointerdown="startRowDrag(event)">'
        + '<span class="rowgriplab">↕ 拖动调整行高</span></th></tr>'
        + '</thead>'
        + '<tbody>' + visible.map(listHtml).join('') + '</tbody></table>'
        // 行高把手：**横跨整张表**的一根线，放在表格下方 ——
        // ⚠️ 不放在表头里：表头是 th，塞一根横线会破坏列布局。
        + moreBtn
  } else if (state.view === 'project') {
    const groups = {}
    for (const r of visible) (groups[r.project || '(未分类)'] = groups[r.project || '(未分类)'] || []).push(r)
    c.innerHTML = Object.entries(groups).map(([p, items]) =>
      `<div class="group"><h3>📁 ${esc(p)} <span class="count">${items.length} 件</span></h3><div class="cards">${items.map(cardHtml).join('')}</div></div>`).join('') + moreBtn
  } else {
    c.innerHTML = `<div class="cards">${visible.map(cardHtml).join('')}</div>${moreBtn}`
  }
}

/** 清空全部筛选（含 `artifact_type` —— 漏一个就会「清空后仍被卡着」）。 */
function clearFilters() {
  $('q').value = ''
  // ⚠️ 2026-10-19：4 个维度已不是 <select>（改成多选组件 MF）⇒ 清 MF.picked
  for (const k of Object.keys(MF)) { MF[k].picked.length = 0; mfRender(k) }
  const rf = $('fRefine'); if (rf) rf.value = ''
  syncUnrefinedBtn()
  reload()
}
function loadMore() { state.page++; render() }

/* ══════════════════════════════════════════════════════════════════════════
 * 文件视图（2026-10-14 新增 · 档 1d）
 * ══════════════════════════════════════════════════════════════════════════
 * 从**主面板的 `DirBrowser` + `FilesView`** 搬过来。面板删了 ⇒ 能力搬网页版。
 *
 * 两个模式（同一个视图里）：
 *   · **浏览** —— `GET /files/list?dir=`，逐层进目录（面包屑 + 上级）
 *   · **搜索** —— `GET /files?q=&limit=`，Everything 语法（`ext:md` / `dm:today` …）
 *
 * ⚠️ **路径必须过宿主闸门**：`/files/list` 会 `assertInScope`，
 *    范围外的目录回 403 —— 这里**如实显示宿主的理由**，不自己编一句。
 * ⚠️ 面包屑按**分隔符**切（Windows 上 `\` 与 `/` 混用）—— 与 `store.js`
 *    的 `inScopeDir` 同一个教训：不归一化就会把同一目录判成不同目录。
 * ══════════════════════════════════════════════════════════════════════════ */

/** 把路径切成面包屑（兼容 `\` 与 `/`，并保留盘符）。 */
function crumbsOf(p) {
  const s = String(p || '')
  if (!s) return []
  const parts = s.split(/[\\/]+/).filter(Boolean)
  const out = []
  let acc = ''
  parts.forEach((seg, i) => {
    // 第一段若是盘符（`C:`），接上分隔符；其余每段都加分隔符
    acc = i === 0 ? seg : acc + '\\' + seg
    out.push({ name: seg, path: acc })
  })
  return out
}

/** 父目录（已经是根时返回空串）。 */
function parentOf(p) {
  const s = String(p || '').replace(/[\\/]+$/, '')
  const i = Math.max(s.lastIndexOf('\\'), s.lastIndexOf('/'))
  if (i < 0) return ''
  const head = s.slice(0, i)
  return /^[A-Za-z]:$/.test(head) ? head + '\\' : head
}

async function loadDir(dir) {
  state.files.loading = true
  state.files.error = ''
  render()
  try {
    const r = await api(API + '/files/list?dir=' + encodeURIComponent(dir))
    state.files.dir = dir
    state.files.entries = r.entries || []
    state.files.total = r.total || 0
    state.files.truncated = !!r.truncated
    // ⚠️ 只记**成功打开过**的目录（403 的路径不该被记住）
    rememberDir(dir)
  } catch (e) {
    // ⚠️ 宿主的理由原样带出来（403 out-of-scope 的文案在 e.message 里）
    state.files.error = e && e.message ? e.message : String(e)
    state.files.entries = []
  } finally {
    state.files.loading = false
    render()
  }
}

async function searchFiles() {
  const q = state.fileQuery.trim()
  if (!q) { state.fileResults = null; render(); return }
  state.fileSearching = true
  render()
  try {
    const r = await api(API + '/files?q=' + encodeURIComponent(q) + '&limit=200')
    state.fileResults = (r && r.hits) || (Array.isArray(r) ? r : [])
    state.fileResultsError = (r && r.ok === false) ? (r.error || '搜索失败') : ''
  } catch (e) {
    state.fileResults = []
    state.fileResultsError = e && e.message ? e.message : String(e)
  } finally {
    state.fileSearching = false
    render()
  }
}

function renderFiles() {
  const c = $('content')
  const f = state.files
  const searching = state.fileQuery.trim() !== '' || state.fileResults !== null

  const chipRow = '<div class="crumbs">' + FILTER_CHIPS.map((c) =>
    `<span class="crumb${state.fileChip === c.key ? ' crumb-on' : ''}" onclick="setFileChip('${c.key}')">${c.label}</span>`
  ).join('<span class="crumb-sep">·</span>') + '</div>'
  const bar = `<div class="files-bar">
    <input class="grow" id="fq" placeholder="搜索文件（Everything 语法：ext:md / dm:today / size:>10mb）"
      value="${esc(state.fileQuery)}"
      onkeydown="if(event.key==='Enter'){state.fileQuery=this.value;searchFiles()}">
    <button onclick="state.fileQuery=$('fq').value;searchFiles()">搜索</button>
    ${searching ? `<button class="ghost" onclick="state.fileQuery='';state.fileResults=null;render()">返回浏览</button>` : ''}
  </div>` + (searching ? '' : chipRow)

  if (searching) {
    if (state.fileSearching) { c.innerHTML = bar + `<div class="hint" style="margin:10px 0">搜索中…</div>` + skeletonHtml('rows'); return }
    const hits = state.fileResults || []
    if (!hits.length) {
      // ⚠️ 三态分开：搜索失败 / 真无结果 / 有结果（不许拍平成同一句）
      c.innerHTML = bar + (state.fileResultsError
        ? `<div class="empty">⚠️ 搜索失败：${esc(state.fileResultsError)}</div>`
        : `<div class="empty">没有找到匹配的文件。<br><br>试试 <code>ext:md</code> 或 <code>dm:today</code>；<br>⚠️ 搜索依赖 Everything 索引，索引没起来时会搜不到。</div>`)
      return
    }
    c.innerHTML = bar + `<div class="hint" style="margin:10px 0">找到 ${hits.length} 个文件</div>` +
      `<table><thead><tr><th>文件</th><th>大小</th><th>修改时间</th><th>操作</th></tr></thead><tbody>` +
      hits.map((h) => {
        const p = h.path || h.fullPath || ''
        const ms = rowTimeMs(h)
        return `<tr><td class="mono" title="${esc(p)}">${esc(p)}</td>` +
          `<td>${h.size != null ? fmtSize(h.size) : '—'}</td>` +
          `<td>${ms ? fmtDate(Math.floor(ms / 1000)) : '—'}</td>` +
          `<td><button class="ghost" onclick="revealPath('${esc(p).replace(/'/g, "\\'")}')">📂 定位</button></td></tr>`
      }).join('') + `</tbody></table>`
    return
  }

  // ── 浏览模式 ──────────────────────────────────────────────────────────
  if (f.error) {
    // ⚠️ 403 是**设计**（assertInScope），不是 bug —— 如实说，并把"为什么"讲清
    c.innerHTML = bar + `<div class="empty">⚠️ 打不开这个目录：${esc(f.error)}<br><br>` +
      `<span class="hint">宿主只放行<b>索引范围内</b>的路径。范围外的目录会被 403 挡下（这是设计，不是 bug）。</span></div>`
    return
  }
  if (!f.dir) {
    const last = lastDir()
    c.innerHTML = bar + `<div class="empty">输入一个<b>绝对路径</b>开始浏览，或用上面的搜索框。<br><br>` +
      (last ? `<button onclick="loadDir('${esc(last).replace(/'/g, "\\'")}')">继续上次：<code>${esc(last)}</code></button>` : '')
      + `</div>`
    return
  }

  const crumbs = crumbsOf(f.dir)
  const crumbHtml = `<div class="crumbs">` +
    `<button class="ghost" onclick="loadDir('${esc(parentOf(f.dir)).replace(/'/g, "\\'")}')" ${parentOf(f.dir) === f.dir ? 'disabled' : ''}>↑ 上级</button>` +
    crumbs.map((cr) => `<span class="crumb" onclick="loadDir('${esc(cr.path).replace(/'/g, "\\'")}')">${esc(cr.name)}</span>`).join('<span class="crumb-sep">›</span>') +
    `</div>`

  // ⚠️ 骨架屏：**只在真的在加载时**（不是"列表为空"时的占位）
  if (f.loading) { c.innerHTML = bar + crumbHtml + skeletonHtml('rows'); return }

  // ⚠️ 芯片过滤在**渲染前**做（不是隐藏行）—— 否则"共 N 项"会骗人
  const shown = state.fileChip ? f.entries.filter((e) => e.isDirectory || chipMatches(state.fileChip, e.name)) : f.entries

  if (!f.entries.length) {
    c.innerHTML = bar + crumbHtml + `<div class="empty">这个文件夹是空的。</div>`
    return
  }
  if (!shown.length) {
    // ⚠️ **三态分开**（ui-spec §六 的同一条教训）：
    //    目录非空、但**被芯片筛掉了** —— 必须说清是"筛掉的"，并给一键回到全部
    c.innerHTML = bar + crumbHtml
      + `<div class="empty">这个文件夹里有 ${f.entries.length} 项，但没有「${FILTER_CHIPS.find((c) => c.key === state.fileChip).label}」类型的文件。<br><br>`
      + `<span class="hint">不是文件夹空的，是类型筛选把结果筛掉了。</span><br><br>`
      + `<button onclick="setFileChip('')">看全部</button></div>`
    return
  }

  // ⚠️ 「真的空」与「被截断」是两件事（§六 的同一条教训）
  const note = f.truncated
    ? `<div class="hint" style="margin:10px 0">⚠️ 只列了前 ${f.entries.length} 项（共 ${f.total} 项）—— 宿主设了单次上限。</div>`
    : `<div class="hint" style="margin:10px 0">共 ${f.entries.length} 项${state.fileChip ? '，其中 ' + shown.length + ' 项符合类型筛选' : ''}</div>`

  c.innerHTML = bar + crumbHtml + note +
    `<table><thead><tr><th></th><th>名称</th><th>大小</th><th>修改时间</th><th>操作</th></tr></thead><tbody>` +
    shown.map((e) => {
      const p = e.path || ''
      const isDir = !!e.isDirectory
      const ms = rowTimeMs(e)
      return `<tr><td>${thumbCellHtml(e)}</td>` +
        `<td>${isDir
          ? `<a href="#" onclick="event.preventDefault();loadDir('${esc(p).replace(/'/g, "\\'")}')">${esc(e.name)}</a>`
          : `<span class="mono" title="${esc(p)}">${esc(e.name)}</span>`}</td>` +
        `<td>${e.size != null ? fmtSize(e.size) : '—'}</td>` +
        `<td>${ms ? fmtDate(Math.floor(ms / 1000)) : '—'}</td>` +
        `<td><button class="ghost" onclick="revealPath('${esc(p).replace(/'/g, "\\'")}')">📂 定位</button></td></tr>`
    }).join('') + `</tbody></table>`
}

/** 切文件类型芯片（只重渲染，不重拉 —— 过滤是本地做的）。 */
function setFileChip(k) { state.fileChip = k; render() }

/** 在资源管理器中定位（宿主端点，走 POST + CSRF 头）。 */
async function revealPath(p) {
  try {
    await api(API + '/files/reveal', { method: 'POST', body: JSON.stringify({ path: p }) })
    toast('已在资源管理器中定位')
  } catch (e) { toast('定位失败：' + (e && e.message ? e.message : e)) }
}

/* ══════════════════════════════════════════════════════════════════════════
 * 缩略图（2026-10-14 从主面板的 `Thumb` / `thumbUrlsFor` 搬来）
 * ══════════════════════════════════════════════════════════════════════════
 * ⚠️ 三个细节都是**踩过坑**的，别省：
 *
 *   ① **两级回退**：首选自建 `/files/thumb`（过 `assertInScope`，会降采样），
 *      失败退官方 `api/file`（绝对地址），**再失败退类型图标** ——
 *      ⚠️ **不许留破图**（真机上就是那个灰色的小方块 + alt 文字）。
 *
 *   ② **5MB 门槛**：超大的图**不拉缩略图**。端点也会拦 413，
 *      但前端先拦能**少一次请求**（列表里几十张图时这个差别很明显）。
 *
 *   ③ **扩展名白名单**：不按 mime 猜（宿主已经算好了 mime，
 *      但 `files/list` 的条目**没有 mime**，只有 name/path）⇒ 这里只能按扩展名。
 */
const THUMB_EXTS = ['png', 'jpg', 'jpeg', 'jpe', 'gif', 'webp', 'bmp', 'ico', 'svg', 'avif']
const THUMB_MAX_BYTES = 5 * 1024 * 1024

/** 小写扩展名（无点）。 */
function extOfName(name) {
  const s = String(name || '')
  const i = s.lastIndexOf('.')
  return i >= 0 ? s.slice(i + 1).toLowerCase() : ''
}

/**
 * 官方 `api/file` 的绝对地址（回退用）。
 *
 * ⚠️ 三道闸门（与 `lib/client.js` 的 `officialFileUrl` **同源**，别只留一道）：
 *   · 必须是**绝对路径**（相对路径在官方那侧解析不到）；
 *   · 拒绝 **UNC**（`\\server\share`）—— 那会去连网络共享；
 *   · 拒绝控制字符 —— 拼进 URL 会造出畸形请求。
 */
function officialFileUrl(p) {
  const raw = String(p === undefined || p === null ? '' : p)
  if (!/^[A-Za-z]:[\\/]/.test(raw) && raw.charAt(0) !== '/') return ''
  if (/^[/\\]{2}/.test(raw)) return ''
  if (/[\u0000-\u001f\u007f]/.test(raw)) return ''
  try { return new URL('api/file?path=' + encodeURIComponent(raw), location.origin + '/').href } catch { return '' }
}

/**
 * 这条目录项该不该出缩略图，以及**两级 URL**。
 * @returns {{primary: string, fallback: string}|null} `null` = 不出缩略图（用图标）
 */
function thumbUrlsFor(entry) {
  if (!entry || entry.isDirectory) return null
  if (entry.isSymbolicLink) return null
  if (THUMB_EXTS.indexOf(extOfName(entry.name || entry.path)) < 0) return null
  const size = Number(entry.size)
  if (Number.isFinite(size) && size > THUMB_MAX_BYTES) return null
  return {
    primary: API + '/files/thumb?path=' + encodeURIComponent(String(entry.path)),
    fallback: officialFileUrl(entry.path),
  }
}

/** 缩略图格：img（两级回退）+ 一个**一直藏着**的图标（最后兜底）。 */
function thumbCellHtml(entry) {
  const icon = `<span class="ico"${''}>${entry.isDirectory ? '📁' : '📄'}</span>`
  const urls = thumbUrlsFor(entry)
  if (!urls) return `<span class="thumbcell">${icon}</span>`
  const fb = urls.fallback ? ` data-fb="${esc(urls.fallback)}"` : ''
  return `<span class="thumbcell">`
    + `<img src="${esc(urls.primary)}" alt="" loading="lazy"${fb} onerror="thumbError(this)">`
    + icon.replace('<span class="ico"', '<span class="ico" hidden')
    + `</span>`
}

/**
 * `onerror` 处理：**先试回退，再退图标**。
 *
 * ⚠️ 用 `data-fb` 标记"回退已经用过一次"，避免**无限重试**
 *    （回退地址也失败时若不摘掉 `data-fb`，`onerror` 会一直触发）。
 */
function thumbError(img) {
  const fb = img.getAttribute('data-fb')
  if (fb) {
    img.removeAttribute('data-fb')          // ⚠️ 先摘掉，防无限重试
    img.src = fb
    return
  }
  img.hidden = true
  const cell = img.parentNode
  if (cell) { const ico = cell.querySelector('.ico'); if (ico) ico.hidden = false }
}

/* ── 路径拼接（2026-10-14 从主面板的 `absoluteUnder` / `isWindowsPath` 搬来）
 * ⚠️ 为什么要搬：`session-changes` 返回的 **`path` 可能是相对 cwd 的**
 *    （官方形状如此，我们补了个 `cwd` 字段）。不拼成绝对路径 ⇒
 *    「📂 定位」必然失败（拿到个相对路径，宿主解析不到）。
 * ⚠️ 那条**踩过坑**的规则：**分隔符必须跟着 base 的形态走**。
 *    无条件用 `\` 拼，在 POSIX 上会得到 `/home/x/proj\src/a.md` 这种废路径。
 */
function isWindowsPath(p) {
  const t = String(p ?? '')
  if (!t) return false
  if (/^[A-Za-z]:[\\/]/.test(t)) return true
  if (/^[A-Za-z]:$/.test(t)) return true
  return t.indexOf('\\\\') === 0
}

/** 拆出目录与文件名（兼容 \\ 与 /）。 */
function splitPathParts(p) {
  const s = String(p || '')
  const i = Math.max(s.lastIndexOf('\\'), s.lastIndexOf('/'))
  if (i < 0) return { dir: '', name: s }
  return { dir: s.slice(0, i + 1), name: s.slice(i + 1) }
}

/**
 * 把 \`session-changes\` 的返回值规范成渲染用的行模型。
 * ⚠️ 2026-10-14 从主面板的 \`normalizeChanges\` 搬来。**它带的四条规矩都别省**：
 *   ① \`path\` 可能是**相对 cwd**的 ⇒ 必须拼绝对（否则「定位」必失败）；
 *   ② 字段名兼容 \`deleted\` 与旧的 \`removed\`（过渡期）；
 *   ③ 行数**负数/非数字一律夹成 0**（否则界面会显示 \`+-5\` 这种鬼东西）；
 *   ④ \`binary\` / \`oversized\` 转成**真布尔**（宿主可能不给字段）。
 */
function normalizeChanges(payload) {
  let raw = payload && payload.files
  if (!Array.isArray(raw)) raw = payload && payload.changes
  if (!Array.isArray(raw)) return []
  const cwd = payload && payload.cwd ? String(payload.cwd) : ''
  return raw.map((item, i) => {
    const source = item || {}
    const relative = String(source.path || source.display || '')
    const display = String(source.display || relative)
    const absolute = absoluteUnder(cwd, relative)
    const parts = splitPathParts(absolute || display)
    let added = Number(source.added)
    let deleted = Number(source.deleted)
    if (!isFinite(deleted)) deleted = Number(source.removed)
    return {
      index: i,
      path: absolute || display,
      relative,
      display,
      dir: parts.dir,
      name: parts.name,
      added: isFinite(added) && added > 0 ? added : 0,
      deleted: isFinite(deleted) && deleted > 0 ? deleted : 0,
      binary: !!source.binary,
      oversized: !!source.oversized,
    }
  })
}

/** 相对 cwd 的路径拼成绝对（已经是绝对的**原样返回**）。 */
function absoluteUnder(cwd, p) {
  const t = String(p ?? '')
  if (!t) return ''
  if (/^[A-Za-z]:[\\/]/.test(t) || t.charAt(0) === '/') return t
  const base = String(cwd || '').replace(/[\\/]+$/, '')
  if (!base) return t
  let rel = t.replace(/^[\\/]+/, '')
  const win = isWindowsPath(base)
  if (win) rel = rel.replace(/\//g, '\\')
  return base + (win ? '\\' : '/') + rel
}

/* ── 文件类型筛选芯片（2026-10-14 从主面板的 `FILTER_CHIPS` / `chipOfName` 搬来）
 * ⚠️ 扩展名表**照抄**，不自己编：这张表是踩过坑的（比如 `.md` 归"文档"不归"代码"）。
 * ⚠️ 认不出的扩展名归 `other`，**任何芯片都不命中它** ⇒ 选了类型就会把它筛掉
 *    （这是对的：点了"图片"就该只看图片）。
 */
const CHIP_EXTS = {
  doc: ['md', 'markdown', 'txt', 'text', 'log', 'json', 'xml', 'yml', 'yaml', 'toml', 'ini', 'csv', 'tsv', 'pdf', 'doc', 'docx', 'rtf', 'odt', 'xls', 'xlsx', 'ppt', 'pptx'],
  image: ['png', 'jpg', 'jpeg', 'gif', 'webp', 'avif', 'svg', 'bmp', 'ico', 'tif', 'tiff', 'heic', 'psd', 'ai', 'fig'],
  media: ['mp4', 'm4v', 'mov', 'avi', 'mkv', 'webm', 'wmv', 'flv', 'mp3', 'wav', 'flac', 'm4a', 'aac', 'ogg', 'opus'],
  code: ['js', 'mjs', 'cjs', 'jsx', 'ts', 'tsx', 'py', 'rb', 'go', 'rs', 'java', 'c', 'h', 'cpp', 'cs', 'php', 'lua', 'html', 'htm', 'css', 'scss', 'less', 'sh', 'ps1', 'bat', 'cmd', 'sql', 'vue', 'svelte'],
  archive: ['zip', 'rar', '7z', 'tar', 'gz', 'tgz', 'bz2', 'xz', 'zst', 'cab', 'iso', 'jar'],
}
const FILTER_CHIPS = [
  { key: '', label: '全部' },
  { key: 'doc', label: '文档' },
  { key: 'image', label: '图片' },
  { key: 'media', label: '音视频' },
  { key: 'code', label: '代码' },
  { key: 'archive', label: '压缩包' },
]
/** 命中哪个芯片组（认不出来算 `other`）。 */
function chipOfName(name) {
  const s = String(name || '')
  const i = s.lastIndexOf('.')
  const ext = i > 0 ? s.slice(i + 1).toLowerCase() : ''
  if (!ext) return ''
  for (const key of Object.keys(CHIP_EXTS)) if (CHIP_EXTS[key].includes(ext)) return key
  return 'other'
}
/** 芯片是否命中（空 = 「全部」永远命中）。 */
function chipMatches(chip, name) { return !chip ? true : chipOfName(name) === chip }

/* ══════════════════════════════════════════════════════════════════════════
 * 骨架屏 / 空态（2026-10-14 从主面板的 `SkeletonRows` / `StateBlock` 搬来）
 * ══════════════════════════════════════════════════════════════════════════
 * ⚠️ ui-spec §11.5「列表用骨架屏」和 §六「真的空 ≠ 被过滤成空」原来是守**面板**的，
 *    面板删了那两条被废弃（见 `docs/DEPRECATED-TESTS.md` §四）。
 *    ⇒ **在这里接回来**：本页的列表/卡片加载时用骨架屏；空态分三支。
 */
function skeletonHtml(kind) {
  if (kind === 'cards') {
    return `<div class="cards">` + Array.from({ length: 6 }, () => `<div class="skel skel-card"></div>`).join('') + `</div>`
  }
  return Array.from({ length: 6 }, () =>
    `<div class="skel-row"><div class="skel" style="width:34px;height:34px"></div>`
    + `<div class="skel" style="flex:1;height:14px"></div>`
    + `<div class="skel" style="width:70px;height:14px"></div></div>`).join('')
}

/** 时间戳：兼容 `mtimeMs`（毫秒）与 `modified`（秒）两种形状。 */
function rowTimeMs(row) {
  if (!row) return 0
  const ms = Number(row.mtimeMs)
  if (Number.isFinite(ms) && ms > 0) return ms
  const sec = Number(row.modified)
  if (Number.isFinite(sec) && sec > 0) return sec * 1000
  return 0
}

/* ══════════════════════════════════════════════════════════════════════════
 * 改动视图（2026-10-14 新增 · 档 1d）
 * ══════════════════════════════════════════════════════════════════════════
 * 从**主面板的 `ChangesView`** 搬过来。
 *
 * ⚠️ **宿主没有「用户正在看哪个会话」这个概念** ⇒ 只能走 `?recent=1`
 *    （宿主自取「最近一次 workspace/changes 公告」），响应带 `derived: true`。
 *    界面上**必须标出来**这是「最近改动 · 会话 <id>」，**不许说成「当前会话」**。
 * ⚠️ 从没观察到公告 → 404 `nothing-observed` ⇒ **如实说「还没观察到」**，
 *    **绝不回落到「最近修改的文件」凑数**（那是另一种更隐蔽的骗人）。
 * ══════════════════════════════════════════════════════════════════════════ */
async function loadChanges() {
  state.changes.status = 'loading'
  render()
  try {
    const r = await api(API + '/session-changes?recent=1')
    state.changes.status = 'ready'
    // ⚠️ 统一走 normalizeChanges（cwd 拼绝对 / 字段兼容 / 夹负数）——
    //    别在渲染里再写一遍那套判断（两处实现必然漂移）。
    state.changes.items = normalizeChanges(r)
    state.changes.derived = !!(r && r.derived)
    state.changes.sessionId = (r && r.sessionId) || ''
    state.changes.cwd = (r && r.cwd) || ''
    state.changes.turn = (r && r.turn != null) ? r.turn : null
    state.changes.total = (r && r.total != null) ? r.total : null
    state.changes.error = ''
  } catch (e) {
    const msg = e && e.message ? e.message : String(e)
    // 404 nothing-observed 是**正常状态**，不是错误 —— 分开说
    if (/nothing-observed|还没观察到/.test(msg)) {
      state.changes.status = 'none'
      state.changes.error = ''
    } else {
      state.changes.status = 'error'
      state.changes.error = msg
    }
    state.changes.items = []
  }
  render()
}

function renderChanges() {
  const c = $('content')
  const ch = state.changes
  if (ch.status === 'idle') { loadChanges(); c.innerHTML = `<div class="empty">读取中…</div>`; return }
  if (ch.status === 'loading') { c.innerHTML = `<div class="empty">读取中…</div>`; return }
  if (ch.status === 'error') {
    c.innerHTML = `<div class="empty">⚠️ 读不到改动：${esc(ch.error)}<br><br>` +
      `<button onclick="loadChanges()">重试</button></div>`
    return
  }
  if (ch.status === 'none') {
    c.innerHTML = `<div class="empty">插件启动以来<b>还没观察到任何改动公告</b>。<br><br>` +
      `<span class="hint">这不是错误：改动来自宿主的 <code>workspace/changes</code> 事件，<br>` +
      `会话里改过文件之后才会有。</span><br><br><button onclick="loadChanges()">重新读取</button></div>`
    return
  }
  if (!ch.items.length) {
    c.innerHTML = `<div class="empty">这一轮没有文件改动。</div><div style="text-align:center"><button onclick="loadChanges()">重新读取</button></div>`
    return
  }
  // ⚠️ 必须标 derived：这是「最近一次公告」，不是「当前会话」
  // ⚠️ `turn` 在**顶层**（不是每行都有）—— 2026-10-14 修
  const turnTxt = ch.turn != null ? ' · 第 ' + ch.turn + ' 轮' : ''
  const head = ch.derived
    ? `<div class="hint" style="margin:10px 0">⚠️ 这是<b>最近一次改动公告</b>（不是"当前会话"——宿主没有这个概念）` +
      `${ch.sessionId ? ' · 会话 <code>' + esc(String(ch.sessionId).slice(0, 12)) + '…</code>' : ''}${turnTxt}。</div>`
    : `<div class="hint" style="margin:10px 0">共 ${ch.items.length} 个改动文件${turnTxt}</div>`
  c.innerHTML = head + `<table><thead><tr><th>文件</th><th>增/删</th><th>操作</th></tr></thead><tbody>` +
    ch.items.map((f) => {
      // ⚠️ `f` 是 normalizeChanges 出来的行模型（path 已拼成绝对）。
      //    ⚠️ 二进制/超大是**宿主明确标出来的**，必须如实显示
      //       （否则"行数是 0"会被误读成"没改动"）。
      const flags = [f.binary ? '二进制' : '', f.oversized ? '过大' : ''].filter(Boolean).join('/')
      const num = flags ? '<span class="hint">—</span>' : (`+${f.added} −${f.deleted}`)
      return `<tr><td class="mono" title="${esc(f.path)}">${esc(f.display || f.relative)}${flags ? ' <span class="hint">(' + flags + ')</span>' : ''}</td>` +
        `<td>${num}</td>` +
        `<td><button class="ghost" onclick="revealPath('${esc(f.path).replace(/'/g, "\\'")}')">📂 定位</button></td></tr>`
    }).join('') + `</tbody></table>` +
    `<div style="text-align:center;margin:14px 0"><button onclick="loadChanges()">重新读取</button></div>`
}

let zoom = { s: 1, x: 0, y: 0 }
function applyZoom() { const img = $('lbImg'); if (img) img.style.transform = `translate(${zoom.x}px, ${zoom.y}px) scale(${zoom.s})`; const pct = $('zoomPct'); if (pct) pct.textContent = Math.round(zoom.s * 100) + '%' }
function zoomBy(f) { zoom.s = Math.max(0.2, Math.min(8, zoom.s * f)); applyZoom() }
function zoomReset() { zoom = { s: 1, x: 0, y: 0 }; applyZoom() }
function zoomActual() { zoom = { s: 1, x: 0, y: 0 }; applyZoom() }
function setRate(v) { const av = $('lbAudio') || $('lbVideo'); if (av) av.playbackRate = Number(v); const el = $('lbRateVal'); if (el) el.textContent = Number(v).toFixed(2) + 'x' }

async function openPreview(id) {
  const r = await api(API + '/' + id)
  const lb = $('lightbox'); const body = $('lbBody'); const meta = $('lbMeta')
  body.innerHTML = ''
  meta.innerHTML = `<b>${esc(r.title)}</b> · <a href="javascript:void(0)" style="color:var(--acc2)" onclick="openFolder('${r.id}')" title="在文件管理器中打开">${esc(r.path)}</a><br>${esc(r.summary || '')}${r.references && r.references.length ? '<br>📚 用了资料: ' + esc(refNames(r.references).join('、')) : ''}`
  zoomReset()
  if (!r.exists) body.innerHTML = '<div class="empty">🚫 文件缺失：' + esc(r.path) + '</div>'
  else if (r.mime_type.startsWith('image/')) {
    body.innerHTML =
      `<div class="lb-stage" id="lbStage"><img id="lbImg" src="${API}/${id}/file" alt=""></div>
       <div class="lb-controls">
         <button onclick="zoomBy(1.25)">🔍＋</button>
         <button onclick="zoomBy(0.8)">🔍－</button>
         <button onclick="zoomReset()">适应</button>
         <button onclick="zoomActual()">1:1</button>
         <span class="pct" id="zoomPct">100%</span>
         <span style="color:var(--dim);font-size:12px">滚轮缩放 · 拖拽平移 · 双击复位</span>
       </div>`
    const stage = $('lbStage'); const img = $('lbImg')
    const drag = { on: false, sx: 0, sy: 0, ox: 0, oy: 0, pid: null }
    stage.addEventListener('wheel', (e) => { e.preventDefault(); const f = e.deltaY < 0 ? 1.15 : 0.87; zoom.s = Math.max(0.2, Math.min(8, zoom.s * f)); applyZoom() }, { passive: false })
    // Pointer Events + 指针捕获：窗口外松开也能收到 pointerup，且监听器随 stage 销毁无泄漏
    stage.addEventListener('pointerdown', (e) => {
      drag.on = true; drag.pid = e.pointerId; drag.sx = e.clientX; drag.sy = e.clientY; drag.ox = zoom.x; drag.oy = zoom.y
      stage.classList.add('dragging')
      try { stage.setPointerCapture(e.pointerId) } catch { /* ignore */ }
    })
    stage.addEventListener('pointermove', (e) => {
      if (!drag.on || e.pointerId !== drag.pid) return
      zoom.x = drag.ox + (e.clientX - drag.sx)
      zoom.y = drag.oy + (e.clientY - drag.sy)
      applyZoom()
    })
    stage.addEventListener('pointerup', (e) => { if (e.pointerId !== drag.pid) return; drag.on = false; stage.classList.remove('dragging') })
    stage.addEventListener('pointercancel', (e) => { if (e.pointerId !== drag.pid) return; drag.on = false; stage.classList.remove('dragging') })
    // 双击复位/放大：挂在 stage（指针捕获会把合成事件重定向到捕获目标，挂 img 收不到）
    stage.addEventListener('dblclick', () => { zoom.s > 1.05 ? zoomReset() : zoomBy(2) })
  }
  else if (r.mime_type.startsWith('video/')) {
    body.innerHTML = `<video controls id="lbVideo" src="${API}/${id}/file"></video>
      <div class="lb-rate"><span>⏩ 倍速</span><input type="range" min="0.5" max="2" step="0.05" value="1" oninput="setRate(this.value)"><b id="lbRateVal">1.00x</b></div>`
  }
  else if (r.mime_type.startsWith('audio/')) {
    body.innerHTML = `<audio controls id="lbAudio" src="${API}/${id}/file"></audio>
      <div class="lb-rate"><span>⏩ 倍速</span><input type="range" min="0.5" max="2" step="0.05" value="1" oninput="setRate(this.value)"><b id="lbRateVal">1.00x</b></div>`
  }
  else { const t = await fetch(API + '/' + id + '/file').then((x) => x.text()).catch(() => '(无法读取)'); body.innerHTML = `<pre>${esc(t.slice(0, 20000))}</pre>` }
  lb.style.display = 'flex'
}
