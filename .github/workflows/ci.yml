# CI · 产物库插件
# ══════════════════════════════════════════════════════════════════════════
# ✅ **已实测运行：4 次全绿**（run #1~#4，最近一次 HEAD `224247e`）。
#    三格都过：`gate`（ubuntu/node24）· `compat`（windows/node24）· `compat`（ubuntu/node22）。
#
#    ⚠️ **2026-10-11 修一条过时注释 —— 它当场误导了一个子代理。**
#       这里原本写着「**这份 CI 从未运行过**」（那是 2026-10-09 写它时的实情：
#       当时本地比 origin 多 144 个 commit、代理无监听、GitHub 不可达）。
#       后来代理恢复、推送成功、CI 真跑了 —— **但注释没跟着改**。
#       结果是：一个调研子代理读到它，据此**上报「CI 未运行」并质疑上游结论**。
#       ⭐ 这正是 `RULES.md` §0.1「**描述现状的文档会过期**」的活证据，
#         也是 §8.6「注释只解释**为什么**，不解释**是什么**」的原因 ——
#         "跑没跑过"是**状态**（会变），不该写进注释；"为什么用 npm ci"才是（不变）。
#       ⇒ 教训：**注释里只写不变的道理，不写会变的状态。**
#
#    ⚠️ action 版本号（`@v7.0.1` / `@v7.1.0`）来自调研，**未独立复核** ——
#       但**四次运行都成功解析了**，所以它们至少在 2026-10-11 可用。
#       若将来报 "unable to resolve action"，去看 releases 页确认。
# ══════════════════════════════════════════════════════════════════════════
#
# 【设计要点】
#
# ① **CI 只调 `npm run check`** —— 不许在这里拼命令。
#    这是"本地绿 = CI 绿"的**唯一机制**：门禁的定义只有一处（package.json）。
#
# ② **`gate` 这个名字不许改。** 分支保护（ruleset）里 required status check
#    记的就是这个 job 名。改了名 ⇒ 保护失效（或锁死）。
#
# ③ **`npm ci` 而不是 `npm install`** —— `ci` 要求锁文件与 package.json 一致，
#    不一致直接失败。这是有意的：锁漂移是 CI 最常见的第一次红。
#
# ④ **矩阵只跑 22 和 24，不跑 20。** Node 20 已 EOL。
#    ⚠️ `engines` 里写的是 `>=20` —— 与这里不一致是**有意的**：
#       `engines` 是"用户机器上最低能跑什么"，矩阵是"我们保证测过什么"。
#
# ⑤ **Windows 那一格 `continue-on-error: true`。**
#    本插件 Windows 优先（Everything / 原生选择器），但**门禁必须是确定的** ——
#    一个平台特有的偶发失败不该把门禁变红，让人开始无视它。
#    ⇒ 先观察，稳了再摘掉 `continue-on-error`。
#
# ⑥ ⚠️ **`node --test` 的 glob 陷阱**：匹配到 0 个文件时它 **exit 0**。
#    所以 `test:unit` **不直接调 `node --test`**，而是走 `tools/assert-ran.mjs`
#    （它会数"实际跑了几条"并跟磁盘上的文件数对账）。见那个文件的注释。

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # 允许手动触发（调试 CI 用）
  workflow_dispatch:

# 同一分支的新推送取消旧的运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── 门禁：分支保护 required status check 指向的就是这个 job ──────────────
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      # ⚠️ 必须是 ci —— 它会校验锁文件与 package.json 一致
      - name: Install (npm ci)
        run: npm ci

      # ⭐ 唯一入口。**不许在这里拼 lint/test 命令** —— 定义在 package.json 里。
      - name: Gate (lint + tests + dup + doc-stale)
        run: npm run check

      # UI 布局改动的证据（真 Chrome 量几何）
      #
      # ⚠️ 2026-10-22 实证：**ubuntu-latest 默认不装 Chrome/Chromium 到 /usr/bin**
      #    ⇒ findBrowser() 返回 null ⇒ exit 2 ⇒ CI 11 秒全红（三个 job 都是）。
      #    这不是代码问题，是环境问题。
      #    （这段注释原本就写着"我没验过" —— 写对了，但没人去验。）
      - name: Setup Chrome (for render:verify)
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
        id: setup-chrome

      - name: Render geometry (UI layout evidence)
        run: npm run render:verify
        env:
          # setup-chrome 会把装好的路径输出到 steps.setup-chrome.outputs.chrome-path
          RENDER_VERIFY_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}

  # ── 兼容矩阵：观察用，**不阻断** ─────────────────────────────────────────
  compat:
    name: compat (node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
